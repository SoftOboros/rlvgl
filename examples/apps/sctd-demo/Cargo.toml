[package]
name = "rlvgl-app-sctd-demo"
version = "0.2.5"
edition = "2024"
license = "MIT"
description = "SCXML Tutorial Demo App — right-edge machine selector + Machine Panel for iState-generated tutorial state machines."
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl-app-sctd-demo"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
rlvgl-core = { path = "../../../core", version = "0.2.4", default-features = false }
rlvgl-widgets = { path = "../../../widgets", version = "0.2.4", default-features = false }
rlvgl-ui = { path = "../../../ui", version = "0.2.5", default-features = false }
rlvgl-platform = { path = "../../../platform", version = "0.2.4", default-features = false }
rlvgl-decomp = { path = "../../../rlvgl-decomp", version = "0.2.3" }
dining-philosophers = { path = "machines/dining-philosophers", default-features = false, features = [] }
media-player = { path = "machines/media-player", default-features = false, features = [] }
dining-philosophers-interactive = { path = "machines/dining-philosophers-interactive", default-features = false, features = [] }

[features]
default = []
