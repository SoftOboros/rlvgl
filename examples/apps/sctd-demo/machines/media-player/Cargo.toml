[package]
name = "media-player"
version = "0.1.0"
edition = "2021"
description = "Generated SCXML state machine crate (Media Player normalized from Skoda Bolero)"
license = "BSD-1-Clause"
# Never published: this is a demo fixture path-dep of the sctd-demo app, not a
# release artifact. `publish = false` keeps it out of CRATES-CI-01's
# publishable-crate matrix (tests/publish_changed_matrix.rs) — workspace.exclude
# does not suffice because cargo metadata still surfaces it as a path dep.
publish = false

# Provenance:
#   Normalized source: examples/apps/sctd-demo/machines/media-player/source/media_player_normalized.scxml
#   Upstream origin:   vendor/scjson/tutorial/Examples/Qt/SkodaBoleroInfotainment/Model/bolero.scxml
#   Normalization:     In() cross-region predicates replaced by explicit datamodel variables
#                      (s_mute, s_repeat, s_source) per SCTD-00 §5.3 and D-M1P6-7.
#   Generator:         Softoboros iState MCP codegen (istate_codegen_create / rust_ir_emitter)
#   Date:              2026-06-20
# This crate MUST NOT be edited by hand; regenerate via the iState MCP pipeline
# from source/media_player_normalized.scxml.

[lib]
name = "media_player"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
no_std = []

[dev-dependencies]

# NOTE: The [workspace] stanza is intentionally absent here because this crate
# is a path dependency of examples/apps/sctd-demo (a workspace member). Cargo
# cannot have a nested workspace root inside a workspace member's path dep tree.
# Per SCTD-00 §9.4 (workspace isolation): the vector tests are directly
# runnable via the parent workspace.
