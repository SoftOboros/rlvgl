[package]
name = "rlvgl-app-disco-demo"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Shared 747-style demo controller and runtime hooks for rlvgl."
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl-app-disco-demo"
publish = true

[lib]
crate-type = ["rlib"]

[dependencies]
rlvgl-core = { path = "../../../core", version = "0.2.2", default-features = false }
rlvgl-widgets = { path = "../../../widgets", version = "0.2.2", default-features = false }
rlvgl-ui = { path = "../../../ui", version = "0.2.2", default-features = false }
rlvgl-platform = { path = "../../../platform", version = "0.2.2", default-features = false }
rlvgl-decomp = { path = "../../../rlvgl-decomp", version = "0.2.2" }

[features]
default = []
