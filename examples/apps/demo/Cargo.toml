[package]
name = "rlvgl-app-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Demo application for rlvgl showcasing core widgets and plugin features."
publish = false

[lib]
# Build as rlib for static linking. To also build a cdylib for dynamic
# loading, run: cargo build -p rlvgl-app-demo --features dylib
crate-type = ["rlib"]

[dependencies]
rlvgl-core = { path = "../../../core", default-features = false }
rlvgl-widgets = { path = "../../../widgets", default-features = false }
rlvgl-i18n = { path = "../../../i18n" }

[features]
default = []
dylib = []
png = ["rlvgl-core/png"]
jpeg = ["rlvgl-core/jpeg"]
gif = ["rlvgl-core/gif"]
qrcode = ["rlvgl-core/qrcode"]
fontdue = ["rlvgl-core/fontdue"]
