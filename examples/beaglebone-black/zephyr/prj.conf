# rlvgl BeagleBone Black + NHD-7.0CTP-CAPE-P Zephyr demo
#
# Kernel
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Display subsystem (LCDC driver required — may need custom driver)
CONFIG_DISPLAY=y

# I2C for FT5x06 touch controller
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_FT5336=y
CONFIG_INPUT_FT5336_INTERRUPT=n
CONFIG_INPUT_FT5336_PERIOD=10

# Synchronous input mode — avoids queue-full drops during render
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# GPIO for backlight control
CONFIG_GPIO=y

# Serial console (UART0)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Interrupts
CONFIG_DYNAMIC_INTERRUPTS=y
