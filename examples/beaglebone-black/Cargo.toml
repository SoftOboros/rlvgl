[package]
name = "rlvgl-example-bbb"
version = "0.2.0"
edition = "2024"
publish = false

[[bin]]
name = "rlvgl-bbb"
path = "src/main.rs"

[[bin]]
name = "rlvgl-bbb-bare"
path = "src/bare_metal.rs"
required-features = ["bare_metal"]

[features]
default = ["linux"]
# Linux userspace: /dev/mem-backed LCDC driver + kernel evdev touch.
linux = ["rlvgl-platform/linux_fbdev"]
bare_metal = []
freertos = ["bare_metal"]
zephyr = ["bare_metal"]

[dependencies]
rlvgl-core = { path = "../../core" }
rlvgl-platform = { path = "../../platform", default-features = false }
rlvgl-app-disco-demo = { path = "../apps/disco-demo" }
libc = "0.2"

[build-dependencies]
cc = "1"
