# rlvgl STM32H747I-DISCO Zephyr demo
# Kernel
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_FPU=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Display subsystem
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_FB_NUM=2

# MIPI-DSI — Zephyr video-mode driver for initial bringup
CONFIG_MIPI_DSI=y

# I2C for FT5336 touch
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_FT5336=y
CONFIG_INPUT_FT5336_INTERRUPT=n
CONFIG_INPUT_FT5336_PERIOD=10

# SDRAM via FMC
CONFIG_MEMC=y
CONFIG_MEMC_STM32=y

# DMA2D (no Zephyr driver — raw register access from Rust)
# Enable the clock gate via DT overlay.

# Serial console
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# SD card via SDMMC
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STM32=y

# QSPI flash
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=y

# Filesystem: FatFS with multi-volume support
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MAX_SS=512
CONFIG_FS_FATFS_LFN=y

# GPIO for scope probes, backlight, and joystick
CONFIG_GPIO=y
CONFIG_INPUT_GPIO_KEYS=y

# Interrupts
CONFIG_DYNAMIC_INTERRUPTS=y
