# rlvgl STM32H747I-DISCO Zephyr demo
# Kernel
# 16 KiB main stack: render loop hosts the controller widget tree, the
# StarCrawl struct (~800 B scanline buffer), `RotatedRenderer`, and
# per-pixel `BlitterRenderer.draw_pixels` recursion. Default 4 KiB
# overflowed during crawl render and reset the board.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_FPU=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Display subsystem
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_FB_NUM=2

# MIPI-DSI — Zephyr video-mode driver for initial bringup
CONFIG_MIPI_DSI=y

# I2C for FT5336 touch
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_FT5336=y
CONFIG_INPUT_FT5336_INTERRUPT=n
CONFIG_INPUT_FT5336_PERIOD=10

# SDRAM via FMC
CONFIG_MEMC=y
CONFIG_MEMC_STM32=y

# DMA2D (no Zephyr driver — raw register access from Rust)
# Enable the clock gate via DT overlay.

# Serial console
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Logging — DBG on INPUT so FT5336 polling path prints its per-touch lines.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_INPUT_LOG_LEVEL_DBG=y

# SD card via SDMMC
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STM32=y

# QSPI flash
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=y

# Filesystem: FatFS with multi-volume support
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MAX_SS=512
CONFIG_FS_FATFS_LFN=y

# GPIO for scope probes, backlight, and joystick
CONFIG_GPIO=y
CONFIG_INPUT_GPIO_KEYS=y

# Interrupts
CONFIG_DYNAMIC_INTERRUPTS=y
