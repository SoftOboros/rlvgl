# rlvgl STM32H747I-DISCO Zephyr demo
# Kernel
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Display subsystem
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_FB_NUM=2

# MIPI-DSI (node disabled in overlay — raw init from Rust)
# CONFIG_MIPI_DSI=y

# I2C for FT5336 touch
CONFIG_I2C=y

# SDRAM via FMC
CONFIG_MEMC=y
CONFIG_MEMC_STM32=y

# DMA2D (no Zephyr driver — raw register access from Rust)
# Enable the clock gate via DT overlay.

# Serial console
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# GPIO for scope probes and backlight
CONFIG_GPIO=y

# Interrupts
CONFIG_DYNAMIC_INTERRUPTS=y
