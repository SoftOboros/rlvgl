name: Build firmware

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Arm GCC
        id: cache-gcc
        uses: actions/cache@v3
        with:
          path: ~/arm-gcc
          key: arm-gcc-14.2.1-1.1

      - name: Download Arm GCC
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/arm-gcc
          curl -L https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz \
            | tar -xz --strip-components=1 -C ~/arm-gcc

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build firmware
        run: |
          export CMAKE_TOOLCHAIN_BIN=$HOME/arm-gcc/bin
          ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/DiscoBiscuit_CM7.elf
            build/DiscoBiscuit_CM7.map
