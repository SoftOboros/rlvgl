[package]
name = "rlvgl-example-beetle-esp32p4"
version = "0.2.0"
edition = "2024"
publish = false
build = "build.rs"
rust-version = "1.88"

# DFRobot DFR1172 FireBeetle 2 ESP32-P4 AI Vision Board driving a Riverdi
# RVT70HSMFWN00 (7", 1024x600 IPS, cap-touch) over the board's 2-lane
# MIPI-DSI interface.
#
# This crate is bare-metal against the `esp32p4` PAC + `esp-riscv-rt`
# runtime. No HAL, no ESP-IDF. The register-level bring-up is done against
# the ESP32-P4 Technical Reference Manual (ingested in memalpha notebook 15
# "Beetle BLE") — same pattern as `examples/stm32h747i-disco/`.
#
# Build:
#   rustup target add riscv32imafc-unknown-none-elf
#   cargo build -p rlvgl-example-beetle-esp32p4 --features esp32p4 \
#     --target riscv32imafc-unknown-none-elf

[[bin]]
name = "rlvgl-beetle-esp32p4"
path = "src/bsp_pac_main.rs"
required-features = ["esp32p4"]

[[bin]]
name = "blink-all"
path = "src/bin/blink_all.rs"
required-features = ["esp32p4"]

[features]
default = []
## Target the ESP32-P4 on the DFRobot DFR1172 FireBeetle 2 AI Vision board.
esp32p4 = [
    "dep:esp32p4",
    "dep:esp-riscv-rt",
    "dep:riscv-rt",
    "dep:riscv",
    "dep:panic-halt",
]
# BEETLE-03m esp-hal reference path was attempted but esp-hal 1.1.1
# (latest as of 2026-06-03) does NOT support esp32p4 — chip features
# are esp32, c2/c3/c5/c6/c61/h2, s2/s3 only. There is no working Rust
# HAL we can compare against; the ESP-IDF C source is the sole
# reference. See examples/beetle-esp32p4/src/esp_hal_probe.rs.bak
# for the attempted code (not built).

[dependencies]
rlvgl-core = { path = "../../core", default-features = false }
rlvgl-platform = { path = "../../platform", default-features = false }
rlvgl-widgets = { path = "../../widgets", default-features = false }

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp32p4 = { version = "0.2", features = ["rt", "critical-section"], optional = true }
esp-riscv-rt = { version = "0.13", optional = true }
# Direct dep with the `memory` feature so riscv-rt's build.rs emits
# `INCLUDE memory.x` into the generated link.x. esp-riscv-rt 0.13 pulls
# riscv-rt 0.16 *without* this feature, leaving REGION_TEXT undefined.
riscv-rt = { version = "0.16", features = ["memory"], optional = true }
# Provides a `_critical_section_1_0_*` impl for the `critical-section`
# crate. Single-hart is correct here — the HP CPU runs one hart for the
# bsp_pac path. The PAC pulls `critical-section` as a dep but does not
# select an impl, which leaves the symbols undefined at link time.
riscv = { version = "0.15", features = ["critical-section-single-hart"], optional = true }
panic-halt = { version = "1", optional = true }
