[package]
name = "rlvgl-runtime-std"
version = "0.0.0"
authors = ["Ira Abbott <ira@softoboros.com>"]
edition = "2024"
license = "MIT"
description = "Interpreter-neutral std ownership boundary for rlvgl host runtimes."
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl-runtime-std"
keywords = ["graphics", "gui", "runtime", "embedded-linux"]
categories = ["gui"]
publish = false

[dependencies]
crossbeam-channel = "0.5.16"
rlvgl-core = { version = "0.2.6", path = "../core", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "pipe"] }

[dev-dependencies]
rlvgl-api = { version = "0.2.1", path = "../api", default-features = false }
rlvgl-widgets = { version = "0.2.6", path = "../widgets", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
