# Publishes crates to crates.io when a release tag is pushed or the workflow is manually dispatched.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base:
        description: "Base SHA (e.g., previous release tag commit)"
        required: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve once; reusable Gate P must finish all shards on this exact cohort
  # before publish can reach the authentication step (INV-C1).
  resolve-release:
    outputs:
      date: ${{ steps.nightly.outputs.date }}
      manifest_sha256: ${{ steps.nightly.outputs.manifest_sha256 }}
      helper_sha256: ${{ steps.nightly.outputs.helper_sha256 }}
      source_sha: ${{ steps.nightly.outputs.source_sha }}
      workflow_sha: ${{ steps.nightly.outputs.workflow_sha }}
      artifact_id: ${{ steps.nightly_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.nightly_artifact.outputs.artifact-digest }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Resolve immutable newest nightly cohort
        id: nightly
        shell: bash
        run: |
          bash scripts/setup-ci-env.sh resolve \
            --output-dir "$RUNNER_TEMP/rlvgl-nightly-cohort" \
            --source-sha "$(git rev-parse HEAD)" \
            --workflow-sha "$(git rev-parse HEAD)"
      - name: Retain immutable nightly cohort
        id: nightly_artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rlvgl-nightly-cohort/channel-rust-nightly.toml
            ${{ runner.temp }}/rlvgl-nightly-cohort/cohort.json
          if-no-files-found: error
  gate-p:
    needs: resolve-release
    uses: ./.github/workflows/gate-p-shards.yml
    with:
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}
      workflow_sha: ${{ needs.resolve-release.outputs.workflow_sha }}
      nightly_artifact_id: ${{ needs.resolve-release.outputs.artifact_id }}
      manifest_sha256: ${{ needs.resolve-release.outputs.manifest_sha256 }}

  publish:
    needs: [resolve-release, gate-p]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged commit (or manual head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Resolve base SHA
        id: shas
        shell: bash
        env:
          DISPATCH_BASE: ${{ github.event.inputs.base }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf 'base=%s\n' "$DISPATCH_BASE" >> "$GITHUB_OUTPUT"
          else
            prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || echo "")"
            if [[ -n "$prev_tag" ]]; then
              base="$(git rev-parse "$prev_tag")"
            else
              base="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
            fi
            printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify frozen release source
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download immutable producer cohort
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.resolve-release.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/rlvgl-nightly-cohort
      - name: Verify newest-nightly release freshness before authentication
        shell: bash
        run: |
          bash scripts/setup-ci-env.sh freshness \
            --cohort "$RUNNER_TEMP/rlvgl-nightly-cohort/cohort.json" \
            --manifest "$RUNNER_TEMP/rlvgl-nightly-cohort/channel-rust-nightly.toml" \
            --expected-manifest-sha "${{ needs.resolve-release.outputs.manifest_sha256 }}" \
            --source-sha "${{ needs.resolve-release.outputs.source_sha }}" \
            --workflow-sha "${{ needs.resolve-release.outputs.workflow_sha }}" \
            --output-dir "$RUNNER_TEMP/rlvgl-nightly-freshness"
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish changed crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: bash scripts/publish_changed.sh "${{ steps.shas.outputs.base }}"
