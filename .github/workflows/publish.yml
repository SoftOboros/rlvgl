# Publishes crates to crates.io when a release tag is pushed or the workflow is manually dispatched.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base:
        description: "Base SHA (e.g., previous release tag commit)"
        required: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CRATES-CI-00 §9 INV-C1: publish MUST NOT run without Gate P green on the
  # release ref. Same shape as the gate-p job in crates-ci.yml (duplicated
  # deliberately so the gate that blocks publish is explicit in this file).
  gate-p:
    outputs:
      date: ${{ steps.nightly.outputs.date }}
      manifest_sha256: ${{ steps.nightly.outputs.manifest_sha256 }}
      helper_sha256: ${{ steps.nightly.outputs.helper_sha256 }}
      source_sha: ${{ steps.nightly.outputs.source_sha }}
      workflow_sha: ${{ steps.nightly.outputs.workflow_sha }}
      artifact_id: ${{ steps.nightly_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.nightly_artifact.outputs.artifact-digest }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: docker.io/iraa/rlvgl:latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Resolve immutable newest nightly cohort
        id: nightly
        shell: bash
        run: |
          bash scripts/setup-ci-env.sh resolve \
            --output-dir "$RUNNER_TEMP/rlvgl-nightly-cohort" \
            --source-sha "$(git rev-parse HEAD)" \
            --workflow-sha "$(git rev-parse HEAD)"
      - name: Retain immutable nightly cohort
        id: nightly_artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rlvgl-nightly-cohort/channel-rust-nightly.toml
            ${{ runner.temp }}/rlvgl-nightly-cohort/cohort.json
          if-no-files-found: error
      - name: Prepare build environment
        shell: bash
        run: |
          bash scripts/setup-ci-env.sh prepare \
            --cohort "$RUNNER_TEMP/rlvgl-nightly-cohort/cohort.json" \
            --manifest "$RUNNER_TEMP/rlvgl-nightly-cohort/channel-rust-nightly.toml" \
            --expected-manifest-sha "${{ steps.nightly.outputs.manifest_sha256 }}" \
            --source-sha "${{ steps.nightly.outputs.source_sha }}" \
            --workflow-sha "${{ steps.nightly.outputs.workflow_sha }}"
      - name: Qualify release source and full prepublish on this cohort
        shell: bash
        run: |
          set -euo pipefail
          # Read-only formatting first; no source normalization is admitted.
          cargo fmt --all -- --check
          bash scripts/pre-commit.sh
          RLVGL_LINT_STRICT=1 RUSTFLAGS="" cargo test -p rlvgl-platform --test discipline
          RUSTFLAGS="" cargo test -p rlvgl-platform --test discipline_compile
          RUSTFLAGS="" cargo test -p rlvgl-chips-esp
          RUSTFLAGS="" cargo test -p rlvgl --test esp_ir_roundtrip --features creator
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c3_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c3_cli --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c3_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo check -p rlvgl-example-beetle-esp32c3 --features esp_hal --target riscv32imc-unknown-none-elf
          RUSTFLAGS="" cargo check -p rlvgl-example-beetle-esp32c3 --features bsp_pac --target riscv32imc-unknown-none-elf
          RUSTFLAGS="" cargo clippy -p rlvgl-example-beetle-esp32c3 --features esp_hal --target riscv32imc-unknown-none-elf -- -D warnings
          RUSTFLAGS="" cargo clippy -p rlvgl-example-beetle-esp32c3 --features bsp_pac --target riscv32imc-unknown-none-elf -- -D warnings
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32p4_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32p4_cli --features creator
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32p4_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c6_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c6_cli --features creator
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c6_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c5_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c5_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32h2_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32h2_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c61_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_esp32c61_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo test -p rlvgl-chips-silabs
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_silabs_slstk3701a_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_silabs_slstk3701a_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo test -p rlvgl-chips-ti
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_ti_cc1352r_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_ti_cc1352r_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo test -p rlvgl-chips-microchip
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_microchip_render --features creator,regression
          RUSTFLAGS="" cargo test -p rlvgl --test bsp_microchip_compile --features compile-verify -- --test-threads=1
          RUSTFLAGS="" cargo check --manifest-path examples/launchxl-cc1352r1/Cargo.toml --target thumbv7em-none-eabihf
          RUSTFLAGS="" cargo check --manifest-path examples/slstk3701a/Cargo.toml --target thumbv7em-none-eabihf
          RUSTFLAGS="" cargo check --manifest-path examples/feather-m4-express/Cargo.toml --target thumbv7em-none-eabihf
          RUSTFLAGS="" cargo check -p rlvgl-platform --target aarch64-unknown-linux-gnu --features linux_fbdev
          RUSTFLAGS="" cargo check -p rlvgl-platform --target armv7-unknown-linux-gnueabihf --features linux_fbdev
          RUSTDOCFLAGS="--cfg docsrs --cfg nightly" cargo doc --all-features --no-deps --target x86_64-unknown-linux-gnu
      - name: Stage publishable crates
        run: bash scripts/crates_ci_stage.sh
      - name: Lib consumer smoke (Gate P)
        run: bash consumers/lib-smoke/gate_p.sh
      - name: Creator CLI smoke (Gate P)
        run: bash consumers/creator-cli/smoke.sh
      # CRATES-CI-02: user-sim consumer — golden-PNG check + playit/node
      # automation test (kept in sync with crates-ci.yml).
      - name: User sim consumer (Gate P)
        run: bash consumers/user-sim/gate_p.sh

  publish:
    needs: gate-p
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged commit (or manual head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Resolve base SHA
        id: shas
        shell: bash
        env:
          DISPATCH_BASE: ${{ github.event.inputs.base }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf 'base=%s\n' "$DISPATCH_BASE" >> "$GITHUB_OUTPUT"
          else
            prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || echo "")"
            if [[ -n "$prev_tag" ]]; then
              base="$(git rev-parse "$prev_tag")"
            else
              base="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
            fi
            printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify frozen release source
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download immutable producer cohort
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.gate-p.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/rlvgl-nightly-cohort
      - name: Verify newest-nightly release freshness before authentication
        shell: bash
        run: |
          bash scripts/setup-ci-env.sh freshness \
            --cohort "$RUNNER_TEMP/rlvgl-nightly-cohort/cohort.json" \
            --manifest "$RUNNER_TEMP/rlvgl-nightly-cohort/channel-rust-nightly.toml" \
            --expected-manifest-sha "${{ needs.gate-p.outputs.manifest_sha256 }}" \
            --source-sha "${{ needs.gate-p.outputs.source_sha }}" \
            --workflow-sha "${{ needs.gate-p.outputs.workflow_sha }}" \
            --output-dir "$RUNNER_TEMP/rlvgl-nightly-freshness"
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish changed crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: bash scripts/publish_changed.sh "${{ steps.shas.outputs.base }}"
