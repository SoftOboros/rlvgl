# CRATES-CI-01: Gate P — full source checks, ordered package staging, and
# consumer checks share one immutable nightly cohort through the reusable gate.
# Governed by docs/crates-ci/CRATES-CI-00-CONCEPTS.md §5 (gate topology) and
# §12 (CRATES-CI-01 acceptance).
#
# The reusable workflow owns the runner image and per-job setup. Each shard
# remains subject to a cold hosted disk-fit check before release qualification.
name: crates-ci (Gate P)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'v*'
  workflow_dispatch:

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.nightly.outputs.source_sha }}
      workflow_sha: ${{ steps.nightly.outputs.workflow_sha }}
      manifest_sha256: ${{ steps.nightly.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.nightly_artifact.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Resolve immutable newest nightly cohort
        id: nightly
        shell: bash
        run: |
          bash scripts/setup-ci-env.sh resolve \
            --output-dir "$RUNNER_TEMP/rlvgl-nightly-cohort" \
            --source-sha "$(git rev-parse HEAD)" \
            --workflow-sha "$(git rev-parse HEAD)"
      - name: Retain immutable nightly cohort
        id: nightly_artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rlvgl-nightly-cohort/channel-rust-nightly.toml
            ${{ runner.temp }}/rlvgl-nightly-cohort/cohort.json
          if-no-files-found: error
  gate-p:
    needs: resolve-release
    uses: ./.github/workflows/gate-p-shards.yml
    with:
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}
      workflow_sha: ${{ needs.resolve-release.outputs.workflow_sha }}
      nightly_artifact_id: ${{ needs.resolve-release.outputs.artifact_id }}
      manifest_sha256: ${{ needs.resolve-release.outputs.manifest_sha256 }}
