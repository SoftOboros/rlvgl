# CRATES-CI-05: Gate R — post-publish registry truth. Governed by
# docs/crates-ci/CRATES-CI-00-CONCEPTS.md §5 (gate topology: Gate R runs
# after publish and on a schedule) and §12 (CRATES-CI-05 acceptance:
# "failure pages the repo via workflow failure (no silent skip)").
#
# Gate R builds the same Consumer Projects as Gate P (crates-ci.yml), but
# against REAL crates.io instead of the Staged Registry, plus the literal
# end-user install path (`cargo install rlvgl --features creator`). A red
# Gate R means crates.io truth diverged from expectations: a yanked
# dependency, a broken published version, or registry index lag. There is
# deliberately no continue-on-error anywhere in this file.
#
# EXPECTED RED until v0.2.2 publishes: the GATE=r consumers request
# version "0.2", which resolves to the LATEST published 0.2.x. While that
# is 0.2.1, the user-sim consumer WILL fail — 0.2.1's simulator path is
# known-broken (CRATES-CI-00 §15, P-INCLUDE: disco-demo icons packaged
# outside the crate root). Per the no-silent-skip clause we keep the step
# failing rather than masking it; a red Gate R is the truthful state of
# the registry. It turns green when v0.2.2 lands on crates.io.
#
# Conventions mirrored from crates-ci.yml: ubuntu-latest runner, the
# docker.io/iraa/rlvgl:latest container, scripts/setup-ci-env.sh for
# environment prep, no actions/cache (the container image is the cache).
name: crates-ci (Gate R)

on:
  # (a) After every successful primary or continuation publication —
  # registry truth is checked as soon as a publish completes.
  workflow_run:
    workflows: ["Publish", "Publish Continue"]
    types:
      - completed
  # (b) Daily registry-truth verification; continuation publication is manual-only.
  schedule:
    - cron: '30 16 * * *'
  # (c) On demand.
  workflow_dispatch:

jobs:
  gate-r:
    # Only gate the workflow_run trigger on the upstream conclusion;
    # schedule and workflow_dispatch runs always proceed.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: docker.io/iraa/rlvgl:latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Resolve immutable newest nightly cohort
        id: nightly
        shell: bash
        run: |
          bash scripts/setup-ci-env.sh resolve \
            --output-dir "$RUNNER_TEMP/rlvgl-nightly-cohort" \
            --source-sha "$(git rev-parse HEAD)" \
            --workflow-sha "$(git rev-parse HEAD)"
      - name: Retain immutable nightly cohort
        id: nightly_artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rlvgl-nightly-cohort/channel-rust-nightly.toml
            ${{ runner.temp }}/rlvgl-nightly-cohort/cohort.json
          if-no-files-found: error
      - name: Prepare build environment
        shell: bash
        run: |
          bash scripts/setup-ci-env.sh prepare \
            --cohort "$RUNNER_TEMP/rlvgl-nightly-cohort/cohort.json" \
            --manifest "$RUNNER_TEMP/rlvgl-nightly-cohort/channel-rust-nightly.toml" \
            --expected-manifest-sha "${{ steps.nightly.outputs.manifest_sha256 }}" \
            --source-sha "${{ steps.nightly.outputs.source_sha }}" \
            --workflow-sha "${{ steps.nightly.outputs.workflow_sha }}"
      # No staging step: Gate R consumes real crates.io. GATE=r removes
      # any [patch] config so nothing shadows the registry.
      - name: Lib consumer (Gate R, real crates.io)
        run: GATE=r bash consumers/lib-smoke/gate_p.sh
      # KNOWN-RED until v0.2.2 publishes: "0.2" resolves to 0.2.1, whose
      # simulator path is broken (CRATES-CI-00 §15, P-INCLUDE). Kept
      # failing on purpose — no continue-on-error, no silent skip.
      - name: User sim consumer (Gate R, real crates.io)
        run: GATE=r bash consumers/user-sim/gate_p.sh
      # End-user install path: cargo install rlvgl --features creator
      # from crates.io, then the same CLI round-trip as smoke.sh.
      # GATE_R_FEATURES may grow creator_ui[,creator_ui_automation] once
      # a 0.2.x that builds them is the latest published version.
      - name: Creator CLI install (Gate R, real crates.io)
        run: bash consumers/creator-cli/gate_r.sh
