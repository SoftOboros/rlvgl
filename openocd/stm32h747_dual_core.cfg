# STM32H747 dual-core OpenOCD configuration (ST-Link + SWD)
# Uses upstream interface/target scripts and registers both CM7 (cpu0) and CM4 (cpu1).

source [find interface/stlink.cfg]
transport select hla_swd
adapter speed 100
reset_config srst_only srst_nogate connect_assert_srst
# Hint stm32h7x.cfg to connect under reset on first examine
set CONNECT_UNDER_RESET 1

# Base H7 target config creates cpu0 (CM7)
source [find target/stm32h7x.cfg]

# Ensure cpu0 uses the standard GDB port
if { [info exists stm32h7x.cpu0] } {
    stm32h7x.cpu0 configure -gdb-port 3333
}

# Attempt to register cpu1 (CM4) and assign a separate GDB port
if { [catch { target create stm32h7x.cpu1 cortex_m -dap stm32h7x.dap -coreid 1 } ] } {
    echo "[warn] Could not create stm32h7x.cpu1; your OpenOCD scripts may already provide it or use a different name."
} else {
    stm32h7x.cpu1 configure -gdb-port 3334
}

init
reset halt
