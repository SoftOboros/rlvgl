# Configuration for rlvgl-chips-renesas crate.
[package]
name = "rlvgl-chips-renesas"
version = "0.0.2"
authors = ["Ira Abbott <ira@softoboros.com>"]
edition = "2021"
license = "MIT"
description = "Renesas chip database adapter for rlvgl code generation."
publish = true
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl-chips-renesas"
keywords = ["embedded", "renesas", "mcu", "chipdb", "no_std"]
categories = ["config", "embedded"]

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
