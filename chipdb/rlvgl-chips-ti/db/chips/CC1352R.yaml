# IOC (IO Controller) per-pin function table.
#
# Authority: SWCU185G §11 IO Controller (IOC), Table 11-1 PORT_CFG event
# signal map. CC1352R in the RGZ VQFN-48 package exposes 28 GPIOs as
# DIO_0..DIO_30 (DIO_5..DIO_7 + DIO_16..DIO_17 + DIO_23..DIO_30 are
# high-drive and/or have JTAG / analog secondary capability — see
# datasheet SWRS196I §7.2 Table 7-1 "Signal Descriptions – RGZ Package").
#
# Unlike Espressif IO_MUX (which selects between a fixed set of "function
# 0..N" slots per pad), the SimpleLink IOC writes a single PORT_CFG
# register per DIO that names the **peripheral event signal** directly.
# So the schema here is "for each GPIO, what peripheral signals MAY be
# routed to it" — the runtime port_id (0x00=GPIO, 0x01=AON_CLK32K_OUT,
# 0x07=UART0_TX, 0x08=UART0_RX, …) selection happens in the generated
# io_mux.rs template per-pin write. See SWCU185G §11.2 Table 11-2 for
# the full port_id enumeration.
#
# `analog_capable: true` marks DIOs that route to AUX_ADC_DIO_n
# (datasheet SWRS196I §8.10). `high_drive: true` marks the five
# high-drive DIOs (8 mA at IOCURR=2 instead of 4 mA at IOCURR=1).
# `jtag_alt:` records the secondary JTAG role on DIO_16/17/24/25.
#
# DIO_8 and DIO_9 are not present on RGZ VQFN-48 (the part jumps from
# DIO_7 at pin 12 to DIO_8 at pin 14 — pin 13 is DCDC_SW per Table 7-1).
io_mux:
  - { dio: 0,  pin: 5,   high_drive: false }
  - { dio: 1,  pin: 6,   high_drive: false }
  - { dio: 2,  pin: 7,   high_drive: false }
  - { dio: 3,  pin: 8,   high_drive: false }
  - { dio: 4,  pin: 9,   high_drive: false }
  - { dio: 5,  pin: 10,  high_drive: true  }
  - { dio: 6,  pin: 11,  high_drive: true  }
  - { dio: 7,  pin: 12,  high_drive: true  }
  - { dio: 8,  pin: 14,  high_drive: false }
  - { dio: 9,  pin: 15,  high_drive: false }
  - { dio: 10, pin: 16,  high_drive: false }
  - { dio: 11, pin: 17,  high_drive: false }
  - { dio: 12, pin: 18,  high_drive: false }
  - { dio: 13, pin: 19,  high_drive: false }
  - { dio: 14, pin: 20,  high_drive: false }
  - { dio: 15, pin: 21,  high_drive: false }
  - { dio: 16, pin: 26,  high_drive: true,  jtag_alt: TDO }
  - { dio: 17, pin: 27,  high_drive: true,  jtag_alt: TDI }
  - { dio: 18, pin: 28,  high_drive: false }
  - { dio: 19, pin: 29,  high_drive: false }
  - { dio: 20, pin: 30,  high_drive: false }
  - { dio: 21, pin: 31,  high_drive: false }
  - { dio: 22, pin: 32,  high_drive: false }
  - { dio: 23, pin: 36,  high_drive: false, analog_capable: true }
  - { dio: 24, pin: 37,  high_drive: false, analog_capable: true }
  - { dio: 25, pin: 38,  high_drive: false, analog_capable: true }
  - { dio: 26, pin: 39,  high_drive: false, analog_capable: true }
  - { dio: 27, pin: 40,  high_drive: false, analog_capable: true }
  - { dio: 28, pin: 41,  high_drive: false, analog_capable: true }
  - { dio: 29, pin: 42,  high_drive: false, analog_capable: true }
  - { dio: 30, pin: 43,  high_drive: false, analog_capable: true }

# GPIO matrix subset.
#
# SimpleLink CC13x2/CC26x2 has a **single-stage** routing model (see
# CHIPS-TI-00 §10.3): the IOC PORT_CFG register on each DIO selects one
# peripheral signal directly; there is no separate "matrix" stage à la
# Espressif. This block enumerates the **named peripheral event
# signals** that the IOC's PORT_CFG `port_id` field can resolve. The
# port_id integer is the value to write to PORT_CFG[5:0] for the named
# signal; from SWCU185G §11.2 Table 11-2 PORT_CFG port_id encoding.
#
# Templates emit per-pin writes by looking up `port_id` for the
# board-YAML `signal:` token.
gpio_matrix:
  - { id: 0x00, name: GPIO,            direction: inout }
  - { id: 0x01, name: AON_CLK32K_OUT,  direction: out   }
  - { id: 0x07, name: UART0_TX,        direction: out   }
  - { id: 0x08, name: UART0_RX,        direction: in    }
  - { id: 0x09, name: UART0_CTS,       direction: in    }
  - { id: 0x0A, name: UART0_RTS,       direction: out   }
  - { id: 0x0B, name: UART1_TX,        direction: out   }
  - { id: 0x0C, name: UART1_RX,        direction: in    }
  - { id: 0x0D, name: UART1_CTS,       direction: in    }
  - { id: 0x0E, name: UART1_RTS,       direction: out   }
  - { id: 0x0F, name: PORT_EVENT0,     direction: out   }
  - { id: 0x10, name: PORT_EVENT1,     direction: out   }
  - { id: 0x11, name: PORT_EVENT2,     direction: out   }
  - { id: 0x12, name: PORT_EVENT3,     direction: out   }
  - { id: 0x13, name: PORT_EVENT4,     direction: out   }
  - { id: 0x14, name: PORT_EVENT5,     direction: out   }
  - { id: 0x15, name: PORT_EVENT6,     direction: out   }
  - { id: 0x16, name: PORT_EVENT7,     direction: out   }
  - { id: 0x17, name: CPU_SWV,         direction: out   }
  - { id: 0x20, name: SSI0_RX,         direction: in    }
  - { id: 0x21, name: SSI0_TX,         direction: out   }
  - { id: 0x22, name: SSI0_FSS,        direction: out   }
  - { id: 0x23, name: SSI0_CLK,        direction: out   }
  - { id: 0x24, name: I2C_MSSDA,       direction: inout }
  - { id: 0x25, name: I2C_MSSCL,       direction: inout }
  - { id: 0x29, name: SSI1_RX,         direction: in    }
  - { id: 0x2A, name: SSI1_TX,         direction: out   }
  - { id: 0x2B, name: SSI1_FSS,        direction: out   }
  - { id: 0x2C, name: SSI1_CLK,        direction: out   }
  - { id: 0x2D, name: I2S_AD0,         direction: inout }
  - { id: 0x2E, name: I2S_AD1,         direction: inout }
  - { id: 0x2F, name: I2S_WCLK,        direction: out   }
  - { id: 0x30, name: I2S_BCLK,        direction: out   }
  - { id: 0x31, name: I2S_MCLK,        direction: out   }

# Linker layout — region naming for the `memory.x.jinja` template
# (CHIPS-TI-00 §7). `.text`/`.rodata` go to internal Flash; `.data`/
# `.bss`/`.heap`/`.stack` go to System SRAM. `.ccfg` is a fixed-address
# section that lives in the **last** Flash sector (4 KB at
# 0x00057FA8..0x00057FFF on the CC1352R1F3) per SWCU185G §11.1; the
# `chip.x.jinja` template emits the SECTIONS directive for it.
linker:
  region_text: flash
  region_data: sram
  ccfg_origin: 0x00057FA8
  ccfg_length: 0x00000058
