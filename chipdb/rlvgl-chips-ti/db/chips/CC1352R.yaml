# TI CC1352R SimpleLink Multi-Band Wireless Cortex-M4F MCU chip inventory IR.
#
# Sources:
#   - TI CC1352R datasheet SWRS196I (January 2018 / revised February 2021).
#     Memory organisation (§9.4), system architecture (§8.1, §9.1–9.3),
#     timers (§9.7), serial peripherals + I2C + IOC (§9.8). Package RGZ
#     (7-mm × 7-mm VQFN-48), 28 GPIOs, Cortex-M4F at 48 MHz.
#   - TI CC13x2, CC26x2 SimpleLink Wireless MCU Technical Reference Manual
#     SWCU185G (the "SWCU185" cited by CHIPS-TI-00 §0 / §5.5). Authority for
#     the IO Controller (IOC) PORT_CFG layout and PRCM clock-gate semantics.
#   - svd2rust-shaped SVD `cc13x2_26x2.svd` from
#     https://github.com/seanmlyons22/ti-lprf-pacs (also redistributed in
#     `cc13x2_26x2_pac` 0.10.3 on crates.io, BSD-3-Clause). Authority for
#     peripheral baseAddress values; cross-checked against SWCU185G §1.5
#     Memory Map.
#   - TI driverlib `hw_ints.h` (vendored under zephyrproject-rtos/hal_ti)
#     for interrupt vector numbers. `irq:` is recorded as the NVIC
#     **external IRQ number** (NVIC vector index minus 16, i.e. the value
#     a svd2rust-shaped `pac::interrupt` enum variant takes), not the raw
#     vector slot. UART0_COMB at NVIC slot 21 → external IRQ 5.
#
# Scope note (CHIPS-TI-00 §5.5 SimpleLink Cortex-M4F initial member set):
#   This file documents CC1352R, the R-suffix CC13x2 member named in
#   §1.1 as a likely first-chip candidate. The orderable part populated
#   on the LAUNCHXL-CC1352R1 development kit is CC1352R1F3RGZ (352 KB
#   flash, 80 KB SRAM, 256 KB ROM, RGZ VQFN-48 package). Sibling chips
#   CC1312R / CC2642R / CC2652R / CC2652RB / CC1352P / CC2652P share
#   this PAC and may be populated as additional YAML files under
#   subsequent CHIPS-TI-NN sub-letters; their memory maps and IOC pin
#   tables differ only in package / pin count / GPIO count and not in
#   the CC13x2/CC26x2 register-block topology authoritatively documented
#   by SWCU185G.

name: CC1352R
arch: cortex-m4f
package: RGZ
pac_crate: cc13x2_26x2_pac
pac_crate_version: "^0.10"
target_triple: thumbv7em-none-eabihf

# Memory map (datasheet SWRS196I §9.4 + SWCU185G §1.5 Table 1-5).
#
# Flash on CC1352R1F3 is 352 KB at 0x00000000 (the last sector reserved
# for CCFG, see SWCU185G §11.1). System SRAM is 80 KB at 0x20000000
# arranged as five 16-KB blocks. ROM holds TI-RTOS kernel + driverlib +
# bootloader at 0x10000000. 8 KB cache SRAM is alternatively available
# as on-chip GPRAM at 0x11000000 when CCFG.SRAM_CFG.SRAM_REPL=0 (see
# SWCU185G §8.2). Sensor Controller has its own 4 KB AUX_RAM block.
memory:
  - { name: flash,       base: 0x00000000, size: 0x00058000, access: rx  } # 352 KB internal Flash
  - { name: rom,         base: 0x10000000, size: 0x00040000, access: rx  } # 256 KB ROM (TI-RTOS + driverlib)
  - { name: gpram,       base: 0x11000000, size: 0x00002000, access: rwx } # 8 KB GPRAM (cache repurposed)
  - { name: sram,        base: 0x20000000, size: 0x00014000, access: rwx } # 80 KB System SRAM (5×16 KB blocks)
  - { name: aux_ram,     base: 0x400E0000, size: 0x00001000, access: rwx } # 4 KB Sensor Controller / AUX SRAM
  - { name: peripherals, base: 0x40000000, size: 0x00100000, access: rw  } # Peripheral region (MCU + AON + AUX)
  - { name: fcfg1,       base: 0x50001000, size: 0x00001000, access: r   } # Factory Configuration (FCFG1)
  - { name: cpu_scs,     base: 0xE0000000, size: 0x00100000, access: rw  } # Cortex-M System Control Space

# Clock tree (datasheet SWRS196I §8.24 + SWCU185G §4 Power, Reset and
# Clock Module / §22 Oscillator).
#
# SCLK_HF is sourced from either a 48 MHz crystal (XOSC_HF), an external
# 48 MHz TCXO, or the on-chip 48 MHz RC oscillator (RCOSC_HF). The CPU
# runs at 48 MHz directly off SCLK_HF; there is no PLL. SCLK_LF is
# either the on-chip 32 kHz RCOSC_LF or an external 32.768 kHz XOSC_LF.
clock_tree:
  xtal_hi_hz: 48000000      # XOSC_HF (high-frequency crystal)
  xtal_lo_hz: 32768         # XOSC_LF (32.768 kHz, optional)
  cpu_hz:     48000000      # Cortex-M4F MCK = SCLK_HF
  apb_hz:     48000000      # Peripheral bus clock = SCLK_HF
  sclk_hf_src: [xosc_hf, rcosc_hf, tcxo]
  sclk_lf_src: [rcosc_lf, xosc_lf, derived_xosc_hf, derived_rcosc_hf]
  # PRCM clock-gate / reset table.
  #
  # Per SWCU185G §4.4 PRCM register map: each peripheral group has a
  # CLKGR (run-mode gate), CLKGS (sleep-mode gate), CLKGDS (deep-sleep
  # gate) and corresponding RSTR/SWRESET in PRCM. To turn a peripheral
  # on, write 1 to its CLKGR bit and pulse PRCM.CLKLOADCTL.LOAD until
  # PRCM.CLKLOADCTL.LOAD_DONE returns 1, then release reset via the
  # peripheral's individual reset register (e.g. PRCM.RESETUART for
  # UART, PRCM.RESETI2C for I2C). Bit positions below are from
  # SWCU185G §4.4 Tables — confirmed against svd2rust accessors in
  # `cc13x2_26x2_pac::prcm`.
  #
  # NOTE: This block populates CHIPS-TI-00 §5.1 `prcm:` required field.
  # The exact bit names used here MUST match the cc13x2_26x2_pac
  # register-block field names (snake_case, e.g. `prcm.uartclkgr.clk_en`)
  # so the future `clocks.rs.jinja` template can reference them as
  # `p.PRCM.<reg>().write(...)`.
prcm:
  uart0:
    clk_en_reg:    prcm.uartclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetuart
    rst_field:     uart
  uart1:
    clk_en_reg:    prcm.uartclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetuart
    rst_field:     uart
  ssi0:
    clk_en_reg:    prcm.ssiclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetssi
    rst_field:     ssi
  ssi1:
    clk_en_reg:    prcm.ssiclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetssi
    rst_field:     ssi
  i2c0:
    clk_en_reg:    prcm.i2cclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.reseti2c
    rst_field:     i2c
  i2s0:
    clk_en_reg:    prcm.i2sclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetaudio
    rst_field:     audio
  gpio:
    clk_en_reg:    prcm.gpioclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetgpio
    rst_field:     gpio
  gpt0:
    clk_en_reg:    prcm.gptclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetgpt
    rst_field:     gpt
  gpt1:
    clk_en_reg:    prcm.gptclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetgpt
    rst_field:     gpt
  gpt2:
    clk_en_reg:    prcm.gptclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetgpt
    rst_field:     gpt
  gpt3:
    clk_en_reg:    prcm.gptclkgr
    clk_en_field:  clk_en
    rst_reg:       prcm.resetgpt
    rst_field:     gpt
  udma0:
    clk_en_reg:    prcm.secdmaclkgr
    clk_en_field:  dma_clk_en
    rst_reg:       prcm.resetsec
    rst_field:     dma
  trng:
    clk_en_reg:    prcm.secdmaclkgr
    clk_en_field:  trng_clk_en
    rst_reg:       prcm.resetsec
    rst_field:     trng
  crypto:
    clk_en_reg:    prcm.secdmaclkgr
    clk_en_field:  crypto_clk_en
    rst_reg:       prcm.resetsec
    rst_field:     crypto
  pka:
    clk_en_reg:    prcm.secdmaclkgr
    clk_en_field:  pka_clk_en
    rst_reg:       prcm.resetsec
    rst_field:     pka

# Peripheral instance map.
#
# Base addresses authoritatively from cc13x2_26x2.svd, cross-checked
# against SWCU185G §1.5 Memory Map. IRQ numbers from TI driverlib
# hw_ints.h (NVIC slot — 16, so the external IRQ index a svd2rust
# `pac::Interrupt` variant takes).
peripherals:
  uart0:
    class: uart
    instance: uart0
    base: 0x40001000
    irq: 5          # INT_UART0_COMB (NVIC slot 21)
    signals:
      - { role: tx,  direction: out, ioc_signal: UART0_TX }
      - { role: rx,  direction: in,  ioc_signal: UART0_RX }
      - { role: cts, direction: in,  ioc_signal: UART0_CTS }
      - { role: rts, direction: out, ioc_signal: UART0_RTS }
  uart1:
    class: uart
    instance: uart1
    base: 0x4000B000
    irq: 36         # INT_UART1_COMB (NVIC slot 52)
    signals:
      - { role: tx,  direction: out, ioc_signal: UART1_TX }
      - { role: rx,  direction: in,  ioc_signal: UART1_RX }
      - { role: cts, direction: in,  ioc_signal: UART1_CTS }
      - { role: rts, direction: out, ioc_signal: UART1_RTS }
  ssi0:
    class: spi_master
    instance: ssi0
    base: 0x40000000
    irq: 7          # INT_SSI0_COMB (NVIC slot 23)
    signals:
      - { role: sck,  direction: out, ioc_signal: SSI0_CLK }
      - { role: mosi, direction: out, ioc_signal: SSI0_TX }
      - { role: miso, direction: in,  ioc_signal: SSI0_RX }
      - { role: cs,   direction: out, ioc_signal: SSI0_FSS }
  ssi1:
    class: spi_master
    instance: ssi1
    base: 0x40008000
    irq: 8          # INT_SSI1_COMB (NVIC slot 24)
    signals:
      - { role: sck,  direction: out, ioc_signal: SSI1_CLK }
      - { role: mosi, direction: out, ioc_signal: SSI1_TX }
      - { role: miso, direction: in,  ioc_signal: SSI1_RX }
      - { role: cs,   direction: out, ioc_signal: SSI1_FSS }
  i2c0:
    class: i2c
    instance: i2c0
    base: 0x40002000
    irq: 1          # INT_I2C_IRQ (NVIC slot 17)
    signals:
      - { role: scl, direction: inout, ioc_signal: I2C_MSSCL }
      - { role: sda, direction: inout, ioc_signal: I2C_MSSDA }
  i2s0:
    class: i2s
    instance: i2s0
    base: 0x40021000
    irq: 12         # INT_I2S_IRQ (NVIC slot 28)
    signals:
      - { role: bclk, direction: out, ioc_signal: I2S_BCLK }
      - { role: wclk, direction: out, ioc_signal: I2S_WCLK }
      - { role: ad0,  direction: out, ioc_signal: I2S_AD0 }
      - { role: ad1,  direction: in,  ioc_signal: I2S_AD1 }
      - { role: mclk, direction: out, ioc_signal: I2S_MCLK }
  gpio:
    class: gpio
    instance: gpio
    base: 0x40022000
    irq: 0          # INT_AON_GPIO_EDGE (NVIC slot 16)
    signals: []
  ioc:
    class: io_controller
    instance: ioc
    base: 0x40081000
    irq: null
    signals: []
  prcm:
    class: clock_controller
