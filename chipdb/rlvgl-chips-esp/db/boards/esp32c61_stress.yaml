# Stress variant of the ESP32-C61 Minimal board for compile-verify
# regression of non-UART0 peripherals on esp32c61 0.3 (svd2rust 0.37+).
#
# Purpose (CHIPS-ESP-10a): same rationale as the C6/H2/C5 stress boards.
# C61 has a trimmed peripheral set vs C6 — no RMT, no TWAI — so this
# stress board pulls only peripherals whose PCR system-gate is present
# in the C61 PAC: UART0 + I2C0 + TIMG0 + LEDC. The deferred peripherals
# (rmt, twai0) are commented out in the chipdb system_gates table per
# CHIPS-ESP-10 and MUST NOT be referenced here.
#
# CHIPS-ESP-12a (2026-05-16) made the SPI2 init template vintage-agnostic
# (byte order moved off USER → bit order on CTRL), so this stress board
# also pulls SPI2 alongside the other peripherals.
#
# CHIPS-ESP-10w (2026-05-16) populated `peripherals.spi2.signals` in the
# C61 chip yaml from the C61 datasheet v1.0 Table 2-3 (FSPI = SPI2 on
# GPIO6/7/2/8/3/4 = sck/mosi/miso/cs0/hd/wp, all F2). SPI2 pins on this
# stress board are now routed via the IO MUX fast path; TIMG0 moved off
# GPIO6 to GPIO9 to free the SCK pin.

name: ESP32-C61 Stress
chip: ESP32-C61
module: null
flash_mb: 4
psram_mb: null

console:
  peripheral: uart0
  baud: 115200

pins:
  # UART0 console (matches esp32c61_minimal.yaml)
  - { gpio: 11, signal: UART0_TX, peripheral: uart0, direction: out, label: u0_txd }
  - { gpio: 10, signal: UART0_RX, peripheral: uart0, direction: in,  label: u0_rxd }
  # I2C0 — SCL/SDA via GPIO matrix
  - { gpio: 22, signal: I2C0_SCL, peripheral: i2c0,  direction: inout, label: scl }
  - { gpio: 23, signal: I2C0_SDA, peripheral: i2c0,  direction: inout, label: sda }
  # SPI2 — IO MUX fast-path pins per C61 chipdb signals[] populated by
  # CHIPS-ESP-10w (GPIO6/7/2 = sck/mosi/miso, function slot 2). Exercises
  # the direct-route emission in io_mux.rs against the real esp32c61 PAC.
  - { gpio: 6,  signal: SPI2_SCK,  peripheral: spi2, direction: out, label: sck  }
  - { gpio: 7,  signal: SPI2_MOSI, peripheral: spi2, direction: out, label: mosi }
  - { gpio: 2,  signal: SPI2_MISO, peripheral: spi2, direction: in,  label: miso }
  # TIMG0 — no external pin signal; pin route lands as Plain GPIO but
  # the `peripherals_used` set still pulls TIMG0 in, exercising
  # `pcr.timergroup(0).conf()` cluster paths. Moved off GPIO6 to free
  # the SPI2 IO MUX fast path.
  - { gpio: 9,  signal: TIMG0_PULSE, peripheral: timg0, direction: out, label: timg_pulse }
  # LEDC channel 0 — GPIO matrix signal 0. Note GPIO8 is also the C61
  # FSPICS0 fast-path pin per chipdb, but since this pin claims
  # `peripheral: ledc` the IO MUX is configured for matrix (mcu_sel=1)
  # rather than F2 — no conflict.
  - { gpio: 8,  signal: LEDC_CH0,  peripheral: ledc, direction: out, label: led }

i2c_configs:
  i2c0:
    scl_hz: 400000  # Standard fast-mode I2C — required for template render

features:
  role: stress_test
  scope: compile_verify
