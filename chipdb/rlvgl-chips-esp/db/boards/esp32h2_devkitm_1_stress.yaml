# Stress variant of the ESP32-H2-DevKitM-1 board for compile-verify
# regression of non-UART0 peripherals on esp32h2 0.19 (svd2rust 0.37+).
#
# Purpose (CHIPS-ESP-10a): the minimal `esp32h2_devkitm_1.yaml` only
# exercises UART0, which was the only peripheral whose PCR system-gate
# path was converted to the cluster accessor shape in CHIPS-ESP-09.
# This stress board pulls I2C0 + TIMG0 + LEDC alongside UART0 so the
# compile-verify gate proves the cluster-path conversion across the
# remaining peripherals. H2 has flat `i2c0_conf` distinct from C6 so
# this gates the per-instance I2C system-gate path independently.
#
# SPI2 is deliberately omitted — see beetle_esp32c6_stress.yaml.

name: ESP32-H2-DevKitM-1 Stress
chip: ESP32-H2
module: ESP32-H2-MINI-1
flash_mb: 4
psram_mb: null

console:
  peripheral: uart0
  baud: 115200

pins:
  # UART0 console (matches esp32h2_devkitm_1.yaml)
  - { gpio: 24, signal: UART0_TX, peripheral: uart0, direction: out, label: u0_txd }
  - { gpio: 25, signal: UART0_RX, peripheral: uart0, direction: in,  label: u0_rxd }
  # I2C0 — SCL/SDA via GPIO matrix on free GPIO pins
  - { gpio: 12, signal: I2C0_SCL, peripheral: i2c0,  direction: inout, label: scl }
  - { gpio: 13, signal: I2C0_SDA, peripheral: i2c0,  direction: inout, label: sda }
  # TIMG0 — no external pin signal but exercises the cluster gate path.
  - { gpio: 4,  signal: TIMG0_PULSE, peripheral: timg0, direction: out, label: timg_pulse }
  # LEDC channel 0 — GPIO matrix signal 0 (typical board LED on GPIO8)
  - { gpio: 8,  signal: LEDC_CH0,  peripheral: ledc, direction: out, label: led }

i2c_configs:
  i2c0:
    scl_hz: 400000  # Standard fast-mode I2C — required for template render

features:
  role: stress_test
  scope: compile_verify
  ieee802154: zigbee_thread
  bluetooth: ble5
