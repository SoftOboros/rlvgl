# ESP32-P4 chip inventory IR for rlvgl-creator BSP generation.
#
# Sourced from the ESP32-P4 Technical Reference Manual Pre-release v0.5 and
# ESP32-P4 Series Datasheet v1.0 via the memalpha private corpus.
#
# This file lives under examples/beetle-esp32p4/ because the P4 BSP pipeline
# is being developed in parallel with C3 integration in rlvgl-chips-esp/.
# It is consumed via `rlvgl-creator bsp from-yaml --chip-yaml <this file>`
# rather than the chipdb auto-discovery path.
#
# Several register field and base address values are marked TODO where the
# memalpha queries couldn't surface the specific table row. These should be
# filled in before the downstream compile-smoke test gets turned on.
#
# Schema notes:
# - `system_gates` is the EspIr field name used by C3; for P4 the actual
#   register block is HP_SYS_CLKRST (TRM Chapter 10), NOT PCR. Values are
#   opaque PAC path strings so the schema is reused.
# - `fn0..fn3` matches ESP32-P4 Appendix A which has exactly four IO MUX
#   function slots per HP GPIO.
# - MIPI DSI chip pins 35-40 are dedicated PHY lanes that are NOT in the
#   HP GPIO matrix; they appear only in the board `features` map.

name: ESP32-P4
arch: rv32imafc
package: QFN104-7x7
pac_crate: esp32p4
gpio_count: 55                  # HP GPIO0..GPIO54 per Appendix A

memory:
  # ESP32-P4 TRM Chapter 7 System and Memory (Table 7.3-1 Memory Address Mapping).
  - { name: hp_rom,     base: 0x4FC00000, size: 0x00020000, access: rx  } # 128 KB HP ROM
  - { name: hp_l2mem,   base: 0x4FF00000, size: 0x000C0000, access: rwx } # 768 KB HP L2MEM
  - { name: lp_sram,    base: 0x50108000, size: 0x00008000, access: rwx } # 32 KB LP SRAM
  - { name: mipi_csi_mem, base: 0x50104000, size: 0x00001000, access: rw } # 4 KB MIPI CSI internal memory
  - { name: mipi_dsi_mem, base: 0x50105000, size: 0x00001000, access: rw } # 4 KB MIPI DSI internal memory
  # Cache-mapped external memory windows (TRM §7.3.3.1 External Memory Address Mapping).
  - { name: flash_cache, base: 0x40000000, size: 0x04000000, access: rx  } # 64 MB cache-mapped flash
  - { name: psram_cache, base: 0x48000000, size: 0x04000000, access: rwx } # 64 MB cache-mapped PSRAM

clock_tree:
  xtal_hz: 40000000             # ESP32-P4 TRM §10.2, XTAL_CLK
  # CPLL=360 MHz, MPLL=500 MHz, SPLL=480 MHz (TRM §10.2 Figure 10.2-1)
  pll_freqs_hz: [360000000, 480000000, 500000000]
  cpu_freqs_hz: [360000000, 400000000]    # HP CPU max 400 MHz per datasheet
  apb_hz: 100000000              # SYS_CLK=200 MHz, APB_CLK=100 MHz (TRM §10.2)
  rtc_fast_src: [rc_fast, xtal_d2, pll_lp]  # LP_FAST_CLK sources
  rtc_slow_src: [rc_slow, xtal32k, osc_slow]
  # HP_SYS_CLKRST peripheral clock gates. Register names from TRM Chapter 10
  # Register Summary; field names are from the individual register detail pages.
  # NOTE: P4 uses HP_SYS_CLKRST (NOT PCR like C6/H2, NOT SYSTEM like C3).
  # Reset bits live in HP_SYS_CLKRST_HP_RST_EN1_REG (Table 10.49).
  system_gates:
    uart0:
      # TRM Table 10.7 — UART0 system clock enable.
      clk_en_reg:   hp_sys_clkrst.soc_clk_ctrl1
      clk_en_field: uart0_sys_clk_en
      # TRM Table 10.49 — UART0 core reset.
      rst_reg:      hp_sys_clkrst.hp_rst_en1
      rst_field:    rst_en_uart0_core
      clk_sel_reg:  hp_sys_clkrst.peri_clk_ctrl110
      clk_sel_field: uart0_clk_src_sel
    uart1:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl111
      clk_en_field: uart1_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1
      rst_field:    rst_en_uart1_core
      clk_sel_reg:  hp_sys_clkrst.peri_clk_ctrl111
      clk_sel_field: uart1_clk_src_sel
    # TODO(memalpha): uart2/uart3/uart4 — same shape, different ctrl/rst bit indices
    i2c0:
      # TRM Table 10.17 — I2C0 clock enable.
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl10
      clk_en_field: i2c0_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1
      rst_field:    rst_en_i2c0
    # TODO(memalpha): i2c1 fields — same shape as i2c0
    spi2:
      # TRM Table 10.33 — GPSPI2 HS/MST clock enables.
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl116
      clk_en_field: gpspi2_hs_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1     # TODO verify bit index
      rst_field:    rst_en_gpspi2
      clk_sel_reg:  hp_sys_clkrst.peri_clk_ctrl116
      clk_sel_field: gpspi2_clk_src_sel
    spi3:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl116
      clk_en_field: gpspi3_hs_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1     # TODO verify bit index
      rst_field:    rst_en_gpspi3
    timg0:
      # TODO(memalpha): exact HP_SYS_CLKRST register and bit for TIMG0 clock enable + reset
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl20
      clk_en_field: timergroup0_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1
      rst_field:    rst_en_timergroup0
    timg1:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl20
      clk_en_field: timergroup1_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1
      rst_field:    rst_en_timergroup1
    systimer:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl21
      clk_en_field: systimer_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1
      rst_field:    rst_en_systimer
    ledc:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl22
      clk_en_field: ledc_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1
      rst_field:    rst_en_ledc
    i2s0:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl23
      clk_en_field: i2s0_rx_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en1
      rst_field:    rst_en_i2s0
    gdma:
      # TRM §Chapter 10 — GDMA has both AHB and AXI variants; enable both gates.
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl25
      clk_en_field: gdma_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en0
      rst_field:    rst_en_gdma
    mipi_dsi_host:
      # TODO(memalpha): MIPI DSI host/bridge/dphy clock gate register indices
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl30
      clk_en_field: mipi_dsi_host_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en0
      rst_field:    rst_en_mipi_dsi_host
    mipi_dsi_bridge:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl31
      clk_en_field: mipi_dsi_bridge_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en0
      rst_field:    rst_en_mipi_dsi_bridge
    mipi_dsi_dphy:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl32
      clk_en_field: mipi_dsi_dphy_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en0
      rst_field:    rst_en_mipi_dsi_dphy
    usb_sj:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl35
      clk_en_field: usb_device_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en0
      rst_field:    rst_en_usb_device
    sdmmc:
      clk_en_reg:   hp_sys_clkrst.peri_clk_ctrl40
      clk_en_field: sdmmc_clk_en
      rst_reg:      hp_sys_clkrst.hp_rst_en0
      rst_field:    rst_en_sdmmc

peripherals:
  # Base addresses from ESP32-P4 TRM v1.3 Chapter 7 Table 7.3-2.
  # HP PERI1 block: 0x500C_xxxx — 0x500E_xxxx
  # HP PERI0 block: 0x5000_xxxx — 0x500B_xxxx
  uart0:
    class: uart
    instance: uart0
    base: 0x500CA000                # HP PERI1 — UART0 (sequential after I2S/Parlio)
    irq: null
    signals:
      - { role: tx, direction: out }
      - { role: rx, direction: in }

  uart1:
    class: uart
    instance: uart1
    base: 0x500CB000                # HP PERI1 — UART1
    irq: null
    signals:
      - { role: tx, direction: out }
      - { role: rx, direction: in }

  i2c0:
    class: i2c
    instance: i2c0
    base: 0x500C4000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals:
      - { role: scl, direction: inout }
      - { role: sda, direction: inout }

  i2c1:
    class: i2c
    instance: i2c1
    base: 0x500C5000                # HP PERI1 — sequential after I2C0
    irq: null
    signals:
      - { role: scl, direction: inout }
      - { role: sda, direction: inout }

  spi2:
    class: spi_master
    instance: spi2
    base: 0x500D0000                # Confirmed — TRM Table 7.3-2 (GP-SPI2)
    irq: null
    signals:
      - { role: sck,  direction: out, iomux_pin: 30, iomux_fn: 2 }
      - { role: mosi, direction: out, iomux_pin: 29, iomux_fn: 2 }
      - { role: miso, direction: in,  iomux_pin: 31, iomux_fn: 2 }
      - { role: cs0,  direction: out, iomux_pin: 28, iomux_fn: 2 }

  spi3:
    class: spi_master
    instance: spi3
    base: 0x500D1000                # Confirmed — TRM Table 7.3-2 (GP-SPI3)
    irq: null
    signals: []

  timg0:
    class: timg
    instance: timg0
    base: 0x500C2000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  timg1:
    class: timg
    instance: timg1
    base: 0x500C3000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  systimer:
    class: systimer
    instance: systimer
    base: 0x500E2000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  ledc:
    class: ledc
    instance: ledc
    base: 0x500D3000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  i2s0:
    class: i2s
    instance: i2s0
    base: 0x500C6000                # HP PERI1 — sequential after I2C1
    irq: null
    signals: []

  rmt:
    class: rmt
    instance: rmt
    base: 0x500A2000                # Confirmed — TRM Table 7.3-2 (HP PERI0)
    irq: null
    signals: []

  adc:
    class: adc
    instance: adc
    base: 0x500DE000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  mcpwm0:
    class: mcpwm
    instance: mcpwm0
    base: 0x500C0000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  mcpwm1:
    class: mcpwm
    instance: mcpwm1
    base: 0x500C1000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  twai0:
    class: twai
    instance: twai0
    base: 0x500D7000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  twai1:
    class: twai
    instance: twai1
    base: 0x500D8000                # Confirmed
    irq: null
    signals: []

  twai2:
    class: twai
    instance: twai2
    base: 0x500D9000                # Confirmed
    irq: null
    signals: []

  i3c_mst:
    class: i3c_master
    instance: i3c_mst
    base: 0x500DA000                # Confirmed
    irq: null
    signals: []

  lcd_cam:
    class: lcd_cam
    instance: lcd_cam
    base: 0x500DC000                # Confirmed
    irq: null
    signals: []

  gpio:
    class: gpio
    instance: gpio
    base: 0x500E0000                # Confirmed
    irq: null
    signals: []

  usb_sj:
    class: usb_serial_jtag
    instance: usb_sj
    base: 0x500D2000                # Confirmed — USB Serial/JTAG Controller
    irq: null
    signals:
      # USB D-/D+ are dedicated pins (not GPIO matrix) per datasheet §2.4.
      - { role: dm, direction: inout }
      - { role: dp, direction: inout }

  mipi_dsi_host:
    class: mipi_dsi
    instance: mipi_dsi_host
    base: 0x500A0000                # Confirmed — TRM Table 7.3-2 (HP PERI0, DSI Host)
    irq: null
    signals:
      # DSI data/clock lanes are on dedicated chip pins (37-40 on QFN104);
      # they do NOT appear in the HP GPIO matrix. The board YAML references
      # them through the `features` map rather than the `pins` list.
      - { role: clk_p,   direction: out }
      - { role: clk_n,   direction: out }
      - { role: data0_p, direction: out }
      - { role: data0_n, direction: out }
      - { role: data1_p, direction: out }
      - { role: data1_n, direction: out }

  usb_otg_hs:
    class: usb_otg
    instance: usb_otg_hs
    base: 0x50000000                # Confirmed — USB 2.0 OTG High-Speed
    irq: null
    signals: []

  sdmmc:
    class: sdmmc
    instance: sdmmc
    base: 0x50083000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  gdma_ahb:
    class: gdma
    instance: gdma_ahb
    base: 0x50085000                # Confirmed — GDMA-AHB
    irq: null
    signals: []

  gdma_axi:
    class: gdma
    instance: gdma_axi
    base: 0x5008A000                # Confirmed — GDMA-AXI
    irq: null
    signals: []

  mipi_dsi_bridge:
    class: mipi_dsi
    instance: mipi_dsi_bridge
    base: 0x500A0000                # Same base as DSI Host — bridge regs are sub-block
    irq: null
    signals: []

  mipi_csi_host:
    class: mipi_csi
    instance: mipi_csi_host
    base: 0x5009F000                # Confirmed — TRM Table 7.3-2 (HP PERI0)
    irq: null
    signals: []

  isp:
    class: isp
    instance: isp
    base: 0x500A1000                # Confirmed — TRM Table 7.3-2 (HP PERI0)
    irq: null
    signals: []

  ppa:
    class: ppa
    instance: ppa
    base: 0x50087000                # Confirmed — TRM Table 7.3-2 (HP PERI0, PPA)
    irq: null
    signals: []

  jpeg:
    class: jpeg
    instance: jpeg
    base: 0x50086000                # Confirmed — TRM Table 7.3-2 (HP PERI0, JPEG Codec)
    irq: null
    signals: []

  h264_enc:
    class: h264
    instance: h264_enc
    base: 0x50084000                # Confirmed — TRM Table 7.3-2 (HP PERI0, H264 Encoder)
    irq: null
    signals: []

  lp_uart:
    class: uart
    instance: lp_uart
    base: 0x50121000                # Confirmed — TRM Table 7.3-2
    irq: null
    signals: []

  lp_i2c:
    class: i2c
    instance: lp_i2c
    base: 0x50122000                # Confirmed
    irq: null
    signals: []

# HP IO MUX function table — ESP32-P4 Appendix A Consolidated Pin Overview.
# Each HP GPIO has four function slots (F0..F3), matching the EspIoMuxPin
# schema. Full table is 55 rows; values here are populated from the
# datasheet appendix where chunks were retrieved. Rows marked `(TODO
# memalpha)` carry placeholders because the retrieval did not surface the
# specific function names for that row — they still serialise correctly
# and the generator treats them as plain GPIO.
#
# P4 has no `flash_reserved` pins because the flash interface uses
# dedicated FLASH_* pins outside the GPIO numbering (datasheet §2.4).
io_mux:
  - { gpio: 0,  pad_name: GPIO0,  fn0: GPIO0,  fn1: GPIO0 }
  - { gpio: 1,  pad_name: GPIO1,  fn0: GPIO1,  fn1: GPIO1, analog: XTAL_32K_P }
  - { gpio: 2,  pad_name: GPIO2,  fn0: GPIO2,  fn1: GPIO2, analog: XTAL_32K_N }
  - { gpio: 3,  pad_name: GPIO3,  fn0: GPIO3,  fn1: GPIO3 }
  - { gpio: 4,  pad_name: GPIO4,  fn0: GPIO4,  fn1: GPIO4 }
  - { gpio: 5,  pad_name: GPIO5,  fn0: GPIO5,  fn1: GPIO5 }
  - { gpio: 6,  pad_name: GPIO6,  fn0: GPIO6,  fn1: GPIO6 }
  - { gpio: 7,  pad_name: GPIO7,  fn0: GPIO7,  fn1: GPIO7 }
  - { gpio: 8,  pad_name: GPIO8,  fn0: GPIO8,  fn1: GPIO8 }
  - { gpio: 9,  pad_name: GPIO9,  fn0: GPIO9,  fn1: GPIO9 }
  - { gpio: 10, pad_name: GPIO10, fn0: GPIO10, fn1: GPIO10 }
  - { gpio: 11, pad_name: GPIO11, fn0: GPIO11, fn1: GPIO11 }
