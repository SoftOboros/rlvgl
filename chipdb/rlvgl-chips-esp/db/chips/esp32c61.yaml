# ESP32-C61 chip inventory IR for rlvgl-creator BSP generation.
#
# Source: ESP32-C61 TRM v1.0 (memalpha doc 301), ESP32-C61 Datasheet (doc 230).
#
# C61 is a stripped-down C6 variant with similar peripheral layout.
# WiFi 6 + BLE 5.0. Uses PCR for clock gating. 30 GPIOs (QFN32).
# Same 0x6000_xxxx peripheral address range as C6.
# IO MUX has F0, F1, F2 (3 slots, like C6).

name: ESP32-C61
arch: rv32imac
package: QFN32-5x5
pac_crate: esp32c61
# `esp32c61 = 0.3` is generated with svd2rust 0.37.x (post-`Peripherals`
# struct drop); pac.rs.jinja emits a local `Peripherals` shim under
# `pac_vintage: modern`.
pac_vintage: modern
gpio_count: 30

memory:
  - { name: rom,        base: 0x40000000, size: 0x00020000, access: rx  }
  - { name: hp_sram,    base: 0x40800000, size: 0x00050000, access: rwx }
  - { name: lp_sram,    base: 0x50000000, size: 0x00004000, access: rwx }
  - { name: flash_cache, base: 0x42000000, size: 0x01000000, access: rx }

clock_tree:
  xtal_hz: 40000000
  pll_freqs_hz: [480000000]
  cpu_freqs_hz: [80000000, 160000000]
  apb_hz: 40000000
  rtc_fast_src: [rc_fast, xtal_d2]
  rtc_slow_src: [rc_slow, xtal32k, osc_slow]
  # PCR clock gates — same pattern as C6.
  system_gates:
    uart0:
      # esp32c61 0.3 PCR clusters UART instances: `pcr.uart(0).conf()` /
      # `pcr.uart(0).clk_conf()` with cluster-relative field names
      # (`clk_en`, `rst_en`, `sclk_sel`).
      clk_en_reg:   pcr.uart(0).conf
      clk_en_field: clk_en
      rst_reg:      pcr.uart(0).conf
      rst_field:    rst_en
      clk_sel_reg:  pcr.uart(0).clk_conf
      clk_sel_field: sclk_sel
    uart1:
      # esp32c61 0.3 clusters UART instances; UART1 uses the same cluster
      # accessor shape as UART0 with cluster-relative field names.
      clk_en_reg:   pcr.uart(1).conf
      clk_en_field: clk_en
      rst_reg:      pcr.uart(1).conf
      rst_field:    rst_en
      clk_sel_reg:  pcr.uart(1).clk_conf
      clk_sel_field: sclk_sel
    i2c0:
      # esp32c61 0.3 has flat `i2c0_conf` (single I2C instance); fields
      # are `i2c0_clk_en` / `i2c0_rst_en`. The SCLK select register
      # `pcr.i2c_sclk_conf.i2c_sclk_sel` is a single-bit FieldWriter —
      # handled via `clk_sel_width: 1` per CHIPS-ESP-11.
      clk_en_reg:   pcr.i2c0_conf
      clk_en_field: i2c0_clk_en
      rst_reg:      pcr.i2c0_conf
      rst_field:    i2c0_rst_en
      clk_sel_reg:  pcr.i2c_sclk_conf
      clk_sel_field: i2c_sclk_sel
      clk_sel_width: 1
      clk_sel_value: 0   # XTAL — matches peripherals.rs sclk_sel().clear_bit()
    spi2:
      clk_en_reg:   pcr.spi2_conf
      clk_en_field: spi2_clk_en
      rst_reg:      pcr.spi2_conf
      rst_field:    spi2_rst_en
    timg0:
      # esp32c61 0.3 clusters timer groups: `pcr.timergroup(0).conf()`
      # with cluster-relative field names (`clk_en`, `rst_en`).
      clk_en_reg:   pcr.timergroup(0).conf
      clk_en_field: clk_en
      rst_reg:      pcr.timergroup(0).conf
      rst_field:    rst_en
    timg1:
      clk_en_reg:   pcr.timergroup(1).conf
      clk_en_field: clk_en
      rst_reg:      pcr.timergroup(1).conf
      rst_field:    rst_en
    systimer:
      clk_en_reg:   pcr.systimer_conf
      clk_en_field: systimer_clk_en
      rst_reg:      pcr.systimer_conf
      rst_field:    systimer_rst_en
    ledc:
      clk_en_reg:   pcr.ledc_conf
      clk_en_field: ledc_clk_en
      rst_reg:      pcr.ledc_conf
      rst_field:    ledc_rst_en
    # rmt + twai0: ABSENT in esp32c61 0.3.2 PAC AND in the C61 silicon
    #   itself — investigated and confirmed under CHIPS-ESP-10z
    #   (2026-05-16).
    #
    # Evidence trail (do not re-derive):
    #
    #   1. PAC source — grep -rEi 'rmt|twai|infrared|\bcan\b' in
    #      `~/.cargo/registry/.../esp32c61-0.3.2/src/` returns zero hits.
    #      No `rmt.rs`, no `twai0.rs`, no `pcr/rmt_conf.rs`, no
    #      `pcr/twai0_conf.rs`. The full `pcr/` submodule listing
    #      contains gates for the peripherals present in this SKU
    #      (uart, i2c0, spi2, timergroup, systimer, ledc, usb_device,
    #      gdma, etc.) but nothing for RMT or TWAI.
    #
    #   2. PAC version — 0.3.2 is the latest published release on
    #      crates.io (versions: 0.2.0, 0.3.0, 0.3.1, 0.3.2). Upstream
    #      `esp-rs/esp-pacs` `main` is also at 0.3.2 with the same
    #      module set. No 0.4.x exists.
    #
    #   3. Silicon datasheet — ESP32-C61 Series Datasheet v1.0 (memalpha
    #      doc 230) "Advanced Peripheral Interfaces" lists: SPI ports,
    #      3× UART, I2C, I2S, LEDC (6 ch), USB Serial/JTAG, SDIO 2.0
    #      slave, GDMA, JTAG, ETM. Neither RMT nor TWAI appears in the
    #      peripheral list or the functional block diagram. C61 is a
    #      stripped-down C6 variant; Espressif trimmed both peripherals.
    #
    #   4. ESP-IDF API surface — the official ESP32-C61 peripherals
    #      driver index lists 22 drivers; RMT and TWAI are not among
    #      them.
    #
    # Implication: this is a permanent hardware-level absence, NOT a
    # PAC-version gap. A future esp32c61 PAC bump will NOT surface RMT
    # or TWAI gates. The `peripherals:` block below still declares
    # `rmt`/`twai0` instances (with placeholder base addresses) purely
    # to keep the chipdb schema symmetric across the ESP family — they
    # MUST NOT be referenced by any board's `pins:` table and MUST NOT
    # be added to `system_gates:` here.
    #
    # pending_pac: []   # No peripherals are "absent-pending-PAC-bump"
    #                   #   for C61. The gap above is a silicon-level
    #                   #   absence. If a future PAC revision adds any
    #                   #   genuinely-missing-but-present-in-hardware
    #                   #   peripheral gates (none currently known),
    #                   #   list them here so future-PAC-bumps surface
    #                   #   them as actionable TODOs in the yaml diff.
    usb_sj:
      clk_en_reg:   pcr.usb_device_conf
      clk_en_field: usb_device_clk_en
      rst_reg:      pcr.usb_device_conf
      rst_field:    usb_device_rst_en
    gdma:
      clk_en_reg:   pcr.gdma_conf
      clk_en_field: gdma_clk_en
      rst_reg:      pcr.gdma_conf
      rst_field:    gdma_rst_en

peripherals:
  # Same 0x6000_xxxx layout as C6.
  uart0:
    class: uart
    instance: uart0
    base: 0x60000000
    irq: null
    signals:
      - { role: tx, direction: out, gpio_matrix_id: 6 }
      - { role: rx, direction: in,  gpio_matrix_id: 6 }
  uart1:
    class: uart
    instance: uart1
    base: 0x60001000
    irq: null
    signals:
      - { role: tx, direction: out, gpio_matrix_id: 9 }
      - { role: rx, direction: in,  gpio_matrix_id: 9 }
  i2c0:
    class: i2c
    instance: i2c0
    base: 0x60004000
    irq: null
    signals:
      - { role: scl, direction: inout }
      - { role: sda, direction: inout }
  spi2:
    class: spi_master
    instance: spi2
    base: 0x60081000
    irq: null
    # IO MUX fast-path signals — ESP32-C61 Series Datasheet v1.0 §2.3.3
    # Table 2-3 "IO MUX Pin Functions" (FSPI = SPI2 main interface).
    # All six FSPI signals are F2 on their respective IO MUX pins; chip
    # select sits on GPIO8.
    signals:
      - { role: sck,  direction: out, iomux_pin: 6, iomux_fn: 2 }
      - { role: mosi, direction: out, iomux_pin: 7, iomux_fn: 2 }
      - { role: miso, direction: in,  iomux_pin: 2, iomux_fn: 2 }
      - { role: cs0,  direction: out, iomux_pin: 8, iomux_fn: 2 }
      - { role: hd,   direction: out, iomux_pin: 3, iomux_fn: 2 }
      - { role: wp,   direction: out, iomux_pin: 4, iomux_fn: 2 }
  timg0:
    class: timg
    instance: timg0
    base: 0x60008000
    irq: null
    signals: []
  timg1:
    class: timg
    instance: timg1
    base: 0x60009000
    irq: null
    signals: []
  systimer:
    class: systimer
    instance: systimer
    base: 0x6000A000
    irq: null
    signals: []
  ledc:
    class: ledc
    instance: ledc
    base: 0x60007000
    irq: null
    signals:
      - { role: ch0, direction: out, gpio_matrix_id: 0 }
      - { role: ch1, direction: out, gpio_matrix_id: 1 }
      - { role: ch2, direction: out, gpio_matrix_id: 2 }
      - { role: ch3, direction: out, gpio_matrix_id: 3 }
      - { role: ch4, direction: out, gpio_matrix_id: 4 }
      - { role: ch5, direction: out, gpio_matrix_id: 5 }
  # rmt/twai0: PLACEHOLDER instances for schema symmetry across the ESP
  # family — see the `system_gates:` evidence-trail comment above. The
  # C61 silicon does not implement these peripherals (datasheet v1.0)
  # and the esp32c61 0.3.2 PAC does not expose registers for them. The
  # base addresses below are the C6 layout values, retained only to
  # avoid `None` fields in the chipdb. Boards MUST NOT reference these.
  rmt:
    class: rmt
    instance: rmt
    base: 0x60006000
    irq: null
    signals: []
  twai0:
    class: twai
    instance: twai0
    base: 0x6000B000
    irq: null
    signals: []
  adc:
    class: adc
    instance: adc
    base: 0x6000E000
    irq: null
    signals: []
  usb_sj:
    class: usb_serial_jtag
    instance: usb_sj
    base: 0x6000F000
    irq: null
    signals:
      - { role: dm, direction: inout }
      - { role: dp, direction: inout }
  gdma:
    class: gdma
    instance: gdma
    base: 0x60080000
    irq: null
    signals: []

# IO MUX — from ESP32-C61 Datasheet Table 2-3. 30 GPIOs, F0/F1/F2.
# Similar to C6 but QFN32 package (fewer exposed pins on module).
io_mux:
  - { gpio: 0,  pad_name: XTAL_32K_P, fn0: XTAL_32K_P, fn1: GPIO0 }
  - { gpio: 1,  pad_name: XTAL_32K_N, fn0: XTAL_32K_N, fn1: GPIO1 }
  - { gpio: 2,  pad_name: GPIO2,      fn0: GPIO2,      fn1: GPIO2,  fn2: FSPIQ }
  - { gpio: 3,  pad_name: MTMS,       fn0: MTMS,       fn1: GPIO3,  fn2: FSPIHD }
  - { gpio: 4,  pad_name: MTDI,       fn0: MTDI,       fn1: GPIO4,  fn2: FSPIWP }
  - { gpio: 5,  pad_name: MTCK,       fn0: MTCK,       fn1: GPIO5 }
  - { gpio: 6,  pad_name: MTDO,       fn0: MTDO,       fn1: GPIO6,  fn2: FSPICLK }
  - { gpio: 7,  pad_name: GPIO7,      fn0: GPIO7,      fn1: GPIO7,  fn2: FSPID }
  - { gpio: 8,  pad_name: GPIO8,      fn0: GPIO8,      fn1: GPIO8,  fn2: FSPICS0, strap: true }
  - { gpio: 9,  pad_name: GPIO9,      fn0: GPIO9,      fn1: GPIO9,  strap: true }
  - { gpio: 10, pad_name: U0RXD,      fn0: U0RXD,      fn1: GPIO10 }
  - { gpio: 11, pad_name: U0TXD,      fn0: U0TXD,      fn1: GPIO11 }
  - { gpio: 12, pad_name: USB_DM,     fn0: USB_DM,     fn1: GPIO12 }
  - { gpio: 13, pad_name: USB_DP,     fn0: USB_DP,     fn1: GPIO13 }
  - { gpio: 14, pad_name: SPICS1,     fn0: SPICS1,     fn1: GPIO14, flash_reserved: true }
  - { gpio: 15, pad_name: SPICS0,     fn0: SPICS0,     fn1: GPIO15, flash_reserved: true }
  - { gpio: 16, pad_name: SPIQ,       fn0: SPIQ,       fn1: GPIO16, flash_reserved: true }
  - { gpio: 17, pad_name: SPIWP,      fn0: SPIWP,      fn1: GPIO17, flash_reserved: true }
  - { gpio: 18, pad_name: VDD_SPI,    fn0: GPIO18,     fn1: GPIO18, flash_reserved: true }
  - { gpio: 19, pad_name: SPIHD,      fn0: SPIHD,      fn1: GPIO19, flash_reserved: true }
  - { gpio: 20, pad_name: SPICLK,     fn0: SPICLK,     fn1: GPIO20, flash_reserved: true }
  - { gpio: 21, pad_name: SPID,       fn0: SPID,       fn1: GPIO21, flash_reserved: true }
  - { gpio: 22, pad_name: SDIO_DATA2, fn0: SDIO_DATA2, fn1: GPIO22 }
  - { gpio: 23, pad_name: SDIO_DATA3, fn0: SDIO_DATA3, fn1: GPIO23 }
  - { gpio: 24, pad_name: GPIO24,     fn0: GPIO24,     fn1: GPIO24 }
  - { gpio: 25, pad_name: SDIO_CMD,   fn0: SDIO_CMD,   fn1: GPIO25 }
  - { gpio: 26, pad_name: SDIO_CLK,   fn0: SDIO_CLK,   fn1: GPIO26 }
  - { gpio: 27, pad_name: SDIO_DATA0, fn0: SDIO_DATA0, fn1: GPIO27 }
  - { gpio: 28, pad_name: SDIO_DATA1, fn0: SDIO_DATA1, fn1: GPIO28 }
  - { gpio: 29, pad_name: GPIO29,     fn0: GPIO29,     fn1: GPIO29 }

gpio_matrix:
  - { id: 0,  name: ledc_ls_sig_out0, direction: out }
  - { id: 1,  name: ledc_ls_sig_out1, direction: out }
  - { id: 2,  name: ledc_ls_sig_out2, direction: out }
  - { id: 3,  name: ledc_ls_sig_out3, direction: out }
  - { id: 4,  name: ledc_ls_sig_out4, direction: out }
  - { id: 5,  name: ledc_ls_sig_out5, direction: out }
  - { id: 6,  name: U0TXD_out,        direction: out }
  - { id: 9,  name: U1TXD_out,        direction: out }

# Linker layout — which memory regions back the riscv-rt / esp-riscv-rt
# aliases for the bsp_pac flashable path.
linker:
  region_text: flash_cache
  region_data: hp_sram
