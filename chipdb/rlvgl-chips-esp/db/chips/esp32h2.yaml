# ESP32-H2 chip inventory IR for rlvgl-creator BSP generation.
#
# Source: ESP32-H2 TRM v1.1 (memalpha doc 234), ESP32-H2 Datasheet (doc 233).
#
# H2 uses PCR (Power, Clock, Reset) for per-peripheral clock gating,
# same as C6. Key difference: H2 has NO WiFi — only IEEE 802.15.4
# (Zigbee/Thread) + BLE 5.0. Uses 32 MHz XTAL (not 40 MHz like C3/C6).
#
# IO MUX has F0..F4 (5 slots — one more than C3/C6).
# 28 GPIOs on QFN32 package.
# H2 is structurally a C6 subset focused on 802.15.4/BLE connectivity.

name: ESP32-H2
arch: rv32imac
package: QFN32-5x5
pac_crate: esp32h2
gpio_count: 28

memory:
  # H2 TRM Chapter 5 Memory Address Mapping
  - { name: rom,        base: 0x40000000, size: 0x00020000, access: rx  }  # 128 KB internal ROM
  - { name: hp_sram,    base: 0x40800000, size: 0x00050000, access: rwx }  # 320 KB HP SRAM
  - { name: lp_sram,    base: 0x50000000, size: 0x00001000, access: rwx }  # 4 KB LP SRAM
  - { name: flash_cache, base: 0x42000000, size: 0x00800000, access: rx }  # 8 MB cache-mapped flash

clock_tree:
  xtal_hz: 32000000     # ESP32-H2 uses 32 MHz XTAL (not 40 MHz)
  pll_freqs_hz: [96000000]  # BBPLL = 96 MHz (H2-specific, lower than C6's 480 MHz)
  cpu_freqs_hz: [32000000, 48000000, 64000000, 96000000]
  apb_hz: 32000000      # APB_CLK = XTAL by default
  rtc_fast_src: [rc_fast, xtal_d2]
  rtc_slow_src: [rc_slow, xtal32k, osc_slow]
  # PCR peripheral clock gates — same register naming pattern as C6.
  system_gates:
    uart0:
      clk_en_reg:   pcr.uart0_conf
      clk_en_field: uart0_clk_en
      rst_reg:      pcr.uart0_conf
      rst_field:    uart0_rst_en
      clk_sel_reg:  pcr.uart0_sclk_conf
      clk_sel_field: uart0_sclk_sel
    uart1:
      clk_en_reg:   pcr.uart1_conf
      clk_en_field: uart1_clk_en
      rst_reg:      pcr.uart1_conf
      rst_field:    uart1_rst_en
      clk_sel_reg:  pcr.uart1_sclk_conf
      clk_sel_field: uart1_sclk_sel
    i2c0:
      clk_en_reg:   pcr.i2c_conf
      clk_en_field: i2c_clk_en
      rst_reg:      pcr.i2c_conf
      rst_field:    i2c_rst_en
      clk_sel_reg:  pcr.i2c_sclk_conf
      clk_sel_field: i2c_sclk_sel
    spi2:
      clk_en_reg:   pcr.spi2_conf
      clk_en_field: spi2_clk_en
      rst_reg:      pcr.spi2_conf
      rst_field:    spi2_rst_en
    timg0:
      clk_en_reg:   pcr.timergroup0_conf
      clk_en_field: tg0_clk_en
      rst_reg:      pcr.timergroup0_conf
      rst_field:    tg0_rst_en
    timg1:
      clk_en_reg:   pcr.timergroup1_conf
      clk_en_field: tg1_clk_en
      rst_reg:      pcr.timergroup1_conf
      rst_field:    tg1_rst_en
    systimer:
      clk_en_reg:   pcr.systimer_conf
      clk_en_field: systimer_clk_en
      rst_reg:      pcr.systimer_conf
      rst_field:    systimer_rst_en
    ledc:
      clk_en_reg:   pcr.ledc_conf
      clk_en_field: ledc_clk_en
      rst_reg:      pcr.ledc_conf
      rst_field:    ledc_rst_en
    i2s:
      clk_en_reg:   pcr.i2s_conf
      clk_en_field: i2s_clk_en
      rst_reg:      pcr.i2s_conf
      rst_field:    i2s_rst_en
    rmt:
      clk_en_reg:   pcr.rmt_conf
      clk_en_field: rmt_clk_en
      rst_reg:      pcr.rmt_conf
      rst_field:    rmt_rst_en
    twai0:
      clk_en_reg:   pcr.twai0_conf
      clk_en_field: twai0_clk_en
      rst_reg:      pcr.twai0_conf
      rst_field:    twai0_rst_en
    usb_sj:
      clk_en_reg:   pcr.usb_device_conf
      clk_en_field: usb_device_clk_en
      rst_reg:      pcr.usb_device_conf
      rst_field:    usb_device_rst_en
    gdma:
      clk_en_reg:   pcr.gdma_conf
      clk_en_field: gdma_clk_en
      rst_reg:      pcr.gdma_conf
      rst_field:    gdma_rst_en

peripherals:
  # H2 shares C6 address layout (0x6000_xxxx).
  # Peripheral set is a subset of C6 — no WiFi, no TWAI1, no SDIO.
  uart0:
    class: uart
    instance: uart0
    base: 0x60000000
    irq: null
    signals:
      - { role: tx, direction: out, gpio_matrix_id: 6, iomux_pin: 24, iomux_fn: 0 }
      - { role: rx, direction: in,  gpio_matrix_id: 6, iomux_pin: 23, iomux_fn: 0 }
  uart1:
    class: uart
    instance: uart1
    base: 0x60001000
    irq: null
    signals:
      - { role: tx, direction: out, gpio_matrix_id: 9 }
      - { role: rx, direction: in,  gpio_matrix_id: 9 }
  i2c0:
    class: i2c
    instance: i2c0
    base: 0x60004000
    irq: null
    signals:
      - { role: scl, direction: inout, gpio_matrix_id: 45 }
      - { role: sda, direction: inout, gpio_matrix_id: 46 }
  spi2:
    class: spi_master
    instance: spi2
    base: 0x60081000
    irq: null
    signals:
      - { role: sck,  direction: out, iomux_pin: 4, iomux_fn: 2 }
      - { role: mosi, direction: out, iomux_pin: 5, iomux_fn: 2 }
      - { role: miso, direction: in,  iomux_pin: 0, iomux_fn: 2 }
      - { role: cs0,  direction: out }
  timg0:
    class: timg
    instance: timg0
    base: 0x60008000
    irq: null
    signals: []
  timg1:
    class: timg
    instance: timg1
    base: 0x60009000
    irq: null
    signals: []
  systimer:
    class: systimer
    instance: systimer
    base: 0x6000A000
    irq: null
    signals: []
  ledc:
    class: ledc
    instance: ledc
    base: 0x60007000
    irq: null
    signals:
      - { role: ch0, direction: out, gpio_matrix_id: 0 }
      - { role: ch1, direction: out, gpio_matrix_id: 1 }
      - { role: ch2, direction: out, gpio_matrix_id: 2 }
      - { role: ch3, direction: out, gpio_matrix_id: 3 }
      - { role: ch4, direction: out, gpio_matrix_id: 4 }
      - { role: ch5, direction: out, gpio_matrix_id: 5 }
  i2s:
    class: i2s
    instance: i2s
    base: 0x6000C000
    irq: null
    signals: []
  rmt:
    class: rmt
    instance: rmt
    base: 0x60006000
    irq: null
    signals: []
  twai0:
    class: twai
    instance: twai0
    base: 0x6000B000
    irq: null
    signals: []
  adc:
    class: adc
    instance: adc
    base: 0x6000E000
    irq: null
    signals: []
  usb_sj:
    class: usb_serial_jtag
    instance: usb_sj
    base: 0x6000F000
    irq: null
    signals:
      - { role: dm, direction: inout }
      - { role: dp, direction: inout }
  gdma:
    class: gdma
    instance: gdma
    base: 0x60080000
    irq: null
    signals: []

# IO MUX function table — ESP32-H2 Datasheet Table 2-3.
# H2 has F0..F4 (5 function slots). 28 GPIOs on QFN32.
# H2 UART0 default: U0TXD=GPIO24, U0RXD=GPIO23 via IO MUX F0.
io_mux:
  - { gpio: 0,  pad_name: XTAL_32K_P, fn0: XTAL_32K_P, fn1: GPIO0,  fn2: FSPIQ }
  - { gpio: 1,  pad_name: XTAL_32K_N, fn0: XTAL_32K_N, fn1: GPIO1,  fn2: FSPID }
  - { gpio: 2,  pad_name: GPIO2,      fn0: GPIO2,      fn1: GPIO2,  fn2: FSPIWP }
  - { gpio: 3,  pad_name: GPIO3,      fn0: GPIO3,      fn1: GPIO3,  fn2: FSPIHD }
  - { gpio: 4,  pad_name: MTMS,       fn0: MTMS,       fn1: GPIO4,  fn2: FSPICLK }
  - { gpio: 5,  pad_name: MTDI,       fn0: MTDI,       fn1: GPIO5,  fn2: FSPICS0 }
  - { gpio: 6,  pad_name: MTCK,       fn0: MTCK,       fn1: GPIO6 }
  - { gpio: 7,  pad_name: MTDO,       fn0: MTDO,       fn1: GPIO7 }
  - { gpio: 8,  pad_name: GPIO8,      fn0: GPIO8,      fn1: GPIO8,  strap: true }
  - { gpio: 9,  pad_name: GPIO9,      fn0: GPIO9,      fn1: GPIO9,  strap: true }
  - { gpio: 10, pad_name: GPIO10,     fn0: GPIO10,     fn1: GPIO10 }
  - { gpio: 11, pad_name: GPIO11,     fn0: GPIO11,     fn1: GPIO11 }
  - { gpio: 12, pad_name: GPIO12,     fn0: GPIO12,     fn1: GPIO12 }
  - { gpio: 13, pad_name: GPIO13,     fn0: GPIO13,     fn1: GPIO13 }
  - { gpio: 14, pad_name: GPIO14,     fn0: GPIO14,     fn1: GPIO14 }
  - { gpio: 15, pad_name: SPICS0,     fn0: SPICS0,     fn1: GPIO15, flash_reserved: true }
  - { gpio: 16, pad_name: SPIQ,       fn0: SPIQ,       fn1: GPIO16, flash_reserved: true }
  - { gpio: 17, pad_name: SPIWP,      fn0: SPIWP,      fn1: GPIO17, flash_reserved: true }
  - { gpio: 18, pad_name: VDD_SPI,    fn0: GPIO18,     fn1: GPIO18, flash_reserved: true }
  - { gpio: 19, pad_name: SPIHD,      fn0: SPIHD,      fn1: GPIO19, flash_reserved: true }
  - { gpio: 20, pad_name: SPICLK,     fn0: SPICLK,     fn1: GPIO20, flash_reserved: true }
  - { gpio: 21, pad_name: SPID,       fn0: SPID,       fn1: GPIO21, flash_reserved: true }
  - { gpio: 22, pad_name: USB_DM,     fn0: USB_DM,     fn1: GPIO22 }
  - { gpio: 23, pad_name: USB_DP,     fn0: USB_DP,     fn1: GPIO23 }
  - { gpio: 24, pad_name: U0TXD,      fn0: U0TXD,      fn1: GPIO24 }
  - { gpio: 25, pad_name: U0RXD,      fn0: U0RXD,      fn1: GPIO25, strap: true }
  - { gpio: 26, pad_name: GPIO26,     fn0: GPIO26,     fn1: GPIO26 }
  - { gpio: 27, pad_name: GPIO27,     fn0: GPIO27,     fn1: GPIO27 }

# GPIO matrix signal IDs — same numbering scheme as C6.
gpio_matrix:
  - { id: 0,  name: ledc_ls_sig_out0, direction: out }
  - { id: 1,  name: ledc_ls_sig_out1, direction: out }
  - { id: 2,  name: ledc_ls_sig_out2, direction: out }
  - { id: 3,  name: ledc_ls_sig_out3, direction: out }
  - { id: 4,  name: ledc_ls_sig_out4, direction: out }
  - { id: 5,  name: ledc_ls_sig_out5, direction: out }
  - { id: 6,  name: U0TXD_out,        direction: out }
  - { id: 9,  name: U1TXD_out,        direction: out }
  - { id: 45, name: I2CEXT0_SCL,      direction: inout }
  - { id: 46, name: I2CEXT0_SDA,      direction: inout }
