# ESP32-C5 chip inventory IR for rlvgl-creator BSP generation.
#
# Source: ESP32-C5 TRM v1.0 (memalpha doc 300), ESP32-C5 Datasheet.
#
# C5 uses PCR for per-peripheral clock gating (same as C6/H2).
# WiFi 6 + BLE 5.0. 40 MHz XTAL, 480 MHz PLL, up to 240 MHz CPU.
# Peripheral address layout mirrors C6 (0x6000_xxxx range).
# IO MUX has F0..F2 (3 active slots, like C6).

name: ESP32-C5
arch: rv32imac
package: QFN40-5x5
pac_crate: esp32c5
# `esp32c5 = 0.2` is generated with svd2rust 0.37.x (post-`Peripherals`
# struct drop); pac.rs.jinja emits a local `Peripherals` shim under
# `pac_vintage: modern`.
pac_vintage: modern
gpio_count: 30

memory:
  - { name: rom,        base: 0x40000000, size: 0x00020000, access: rx  }
  - { name: hp_sram,    base: 0x40800000, size: 0x00080000, access: rwx }
  - { name: lp_sram,    base: 0x50000000, size: 0x00004000, access: rwx }
  - { name: flash_cache, base: 0x42000000, size: 0x01000000, access: rx }

clock_tree:
  xtal_hz: 40000000
  pll_freqs_hz: [480000000]
  cpu_freqs_hz: [80000000, 160000000, 240000000]
  apb_hz: 40000000
  rtc_fast_src: [rc_fast, xtal_d2]
  rtc_slow_src: [rc_slow, xtal32k, osc_slow]
  # PCR peripheral clock gates — same register pattern as C6.
  system_gates:
    uart0:
      # esp32c5 0.2 PCR clusters UART instances: `pcr.uart(0).conf()` /
      # `pcr.uart(0).clk_conf()` with cluster-relative field names
      # (`clk_en`, `rst_en`, `sclk_sel`).
      clk_en_reg:   pcr.uart(0).conf
      clk_en_field: clk_en
      rst_reg:      pcr.uart(0).conf
      rst_field:    rst_en
      clk_sel_reg:  pcr.uart(0).clk_conf
      clk_sel_field: sclk_sel
    uart1:
      # esp32c5 0.2 clusters UART instances; UART1 uses the same cluster
      # accessor shape as UART0 with cluster-relative field names.
      clk_en_reg:   pcr.uart(1).conf
      clk_en_field: clk_en
      rst_reg:      pcr.uart(1).conf
      rst_field:    rst_en
      clk_sel_reg:  pcr.uart(1).clk_conf
      clk_sel_field: sclk_sel
    i2c0:
      # esp32c5 0.2 has flat `i2c0_conf` (single I2C instance); fields
      # are `i2c0_clk_en` / `i2c0_rst_en`. The SCLK select register
      # `pcr.i2c_sclk_conf.i2c_sclk_sel` is a single-bit FieldWriter —
      # handled via `clk_sel_width: 1` per CHIPS-ESP-11.
      clk_en_reg:   pcr.i2c0_conf
      clk_en_field: i2c0_clk_en
      rst_reg:      pcr.i2c0_conf
      rst_field:    i2c0_rst_en
      clk_sel_reg:  pcr.i2c_sclk_conf
      clk_sel_field: i2c_sclk_sel
      clk_sel_width: 1
      clk_sel_value: 0   # XTAL — matches peripherals.rs sclk_sel().clear_bit()
    spi2:
      clk_en_reg:   pcr.spi2_conf
      clk_en_field: spi2_clk_en
      rst_reg:      pcr.spi2_conf
      rst_field:    spi2_rst_en
    timg0:
      # esp32c5 0.2 clusters timer groups: `pcr.timergroup(0).conf()`
      # with cluster-relative field names (`clk_en`, `rst_en`).
      clk_en_reg:   pcr.timergroup(0).conf
      clk_en_field: clk_en
      rst_reg:      pcr.timergroup(0).conf
      rst_field:    rst_en
    timg1:
      clk_en_reg:   pcr.timergroup(1).conf
      clk_en_field: clk_en
      rst_reg:      pcr.timergroup(1).conf
      rst_field:    rst_en
    systimer:
      clk_en_reg:   pcr.systimer_conf
      clk_en_field: systimer_clk_en
      rst_reg:      pcr.systimer_conf
      rst_field:    systimer_rst_en
    ledc:
      clk_en_reg:   pcr.ledc_conf
      clk_en_field: ledc_clk_en
      rst_reg:      pcr.ledc_conf
      rst_field:    ledc_rst_en
    i2s:
      clk_en_reg:   pcr.i2s_conf
      clk_en_field: i2s_clk_en
      rst_reg:      pcr.i2s_conf
      rst_field:    i2s_rst_en
    rmt:
      clk_en_reg:   pcr.rmt_conf
      clk_en_field: rmt_clk_en
      rst_reg:      pcr.rmt_conf
      rst_field:    rmt_rst_en
    twai0:
      clk_en_reg:   pcr.twai0_conf
      clk_en_field: twai0_clk_en
      rst_reg:      pcr.twai0_conf
      rst_field:    twai0_rst_en
    twai1:
      clk_en_reg:   pcr.twai1_conf
      clk_en_field: twai1_clk_en
      rst_reg:      pcr.twai1_conf
      rst_field:    twai1_rst_en
    usb_sj:
      clk_en_reg:   pcr.usb_device_conf
      clk_en_field: usb_device_clk_en
      rst_reg:      pcr.usb_device_conf
      rst_field:    usb_device_rst_en
    gdma:
      clk_en_reg:   pcr.gdma_conf
      clk_en_field: gdma_clk_en
      rst_reg:      pcr.gdma_conf
      rst_field:    gdma_rst_en

peripherals:
  # From TRM v1.0 Table 6.3-2 — same 0x6000_xxxx layout as C6.
  uart0:
    class: uart
    instance: uart0
    base: 0x60000000
    irq: null
    signals:
      - { role: tx, direction: out, gpio_matrix_id: 6 }
      - { role: rx, direction: in,  gpio_matrix_id: 6 }
  uart1:
    class: uart
    instance: uart1
    base: 0x60001000
    irq: null
    signals:
      - { role: tx, direction: out, gpio_matrix_id: 9 }
      - { role: rx, direction: in,  gpio_matrix_id: 9 }
  i2c0:
    class: i2c
    instance: i2c0
    base: 0x60004000
    irq: null
    signals:
      - { role: scl, direction: inout, gpio_matrix_id: 45 }
      - { role: sda, direction: inout, gpio_matrix_id: 46 }
  spi2:
    class: spi_master
    instance: spi2
    base: 0x60081000
    irq: null
    # IO MUX fast-path signals — ESP32-C5 Series Datasheet v1.2 §2.3.3
    # Table 2-3 "IO MUX Pin Functions" (FSPI = SPI2 main interface).
    # All six FSPI signals are F2 on their respective IO MUX pins; chip
    # select sits on the SDIO_CMD pad (GPIO10).
    signals:
      - { role: sck,  direction: out, iomux_pin: 6,  iomux_fn: 2 }
      - { role: mosi, direction: out, iomux_pin: 7,  iomux_fn: 2 }
      - { role: miso, direction: in,  iomux_pin: 2,  iomux_fn: 2 }
      - { role: cs0,  direction: out, iomux_pin: 10, iomux_fn: 2 }
      - { role: hd,   direction: out, iomux_pin: 4,  iomux_fn: 2 }
      - { role: wp,   direction: out, iomux_pin: 5,  iomux_fn: 2 }
  timg0:
    class: timg
    instance: timg0
    base: 0x60008000
    irq: null
    signals: []
  timg1:
    class: timg
    instance: timg1
    base: 0x60009000
    irq: null
    signals: []
  systimer:
    class: systimer
    instance: systimer
    base: 0x6000A000
    irq: null
    signals: []
  ledc:
    class: ledc
    instance: ledc
    base: 0x60007000
    irq: null
    signals:
      - { role: ch0, direction: out, gpio_matrix_id: 0 }
      - { role: ch1, direction: out, gpio_matrix_id: 1 }
      - { role: ch2, direction: out, gpio_matrix_id: 2 }
      - { role: ch3, direction: out, gpio_matrix_id: 3 }
      - { role: ch4, direction: out, gpio_matrix_id: 4 }
      - { role: ch5, direction: out, gpio_matrix_id: 5 }
  i2s:
    class: i2s
    instance: i2s
    base: 0x6000C000
    irq: null
    signals: []
  rmt:
    class: rmt
    instance: rmt
    base: 0x60006000
    irq: null
    signals: []
  twai0:
    class: twai
    instance: twai0
    base: 0x6000B000
    irq: null
    signals: []
  twai1:
    class: twai
    instance: twai1
    base: 0x6000D000
    irq: null
    signals: []
  adc:
    class: adc
    instance: adc
    base: 0x6000E000
    irq: null
    signals: []
  usb_sj:
    class: usb_serial_jtag
    instance: usb_sj
    base: 0x6000F000
    irq: null
    signals:
      - { role: dm, direction: inout }
      - { role: dp, direction: inout }
  gdma:
    class: gdma
    instance: gdma
    base: 0x60080000
    irq: null
    signals: []

# IO MUX — C5 has same structure as C6 (F0, F1, F2; 30 GPIOs on QFN40).
io_mux:
  - { gpio: 0,  pad_name: XTAL_32K_P, fn0: XTAL_32K_P, fn1: GPIO0 }
  - { gpio: 1,  pad_name: XTAL_32K_N, fn0: XTAL_32K_N, fn1: GPIO1 }
  - { gpio: 2,  pad_name: GPIO2,      fn0: GPIO2,      fn1: GPIO2,  fn2: FSPIQ }
  - { gpio: 3,  pad_name: GPIO3,      fn0: GPIO3,      fn1: GPIO3 }
  - { gpio: 4,  pad_name: MTMS,       fn0: MTMS,       fn1: GPIO4,  fn2: FSPIHD }
  - { gpio: 5,  pad_name: MTDI,       fn0: MTDI,       fn1: GPIO5,  fn2: FSPIWP }
  - { gpio: 6,  pad_name: MTCK,       fn0: MTCK,       fn1: GPIO6,  fn2: FSPICLK }
  - { gpio: 7,  pad_name: MTDO,       fn0: MTDO,       fn1: GPIO7,  fn2: FSPID }
  - { gpio: 8,  pad_name: GPIO8,      fn0: GPIO8,      fn1: GPIO8,  strap: true }
  - { gpio: 9,  pad_name: GPIO9,      fn0: GPIO9,      fn1: GPIO9,  strap: true }
  - { gpio: 10, pad_name: GPIO10,     fn0: GPIO10,     fn1: GPIO10 }
  - { gpio: 11, pad_name: GPIO11,     fn0: GPIO11,     fn1: GPIO11 }
  - { gpio: 12, pad_name: GPIO12,     fn0: GPIO12,     fn1: GPIO12 }
  - { gpio: 13, pad_name: GPIO13,     fn0: GPIO13,     fn1: GPIO13 }
  - { gpio: 14, pad_name: GPIO14,     fn0: GPIO14,     fn1: GPIO14 }
  - { gpio: 15, pad_name: GPIO15,     fn0: GPIO15,     fn1: GPIO15,  strap: true }
  - { gpio: 16, pad_name: U0TXD,      fn0: U0TXD,      fn1: GPIO16 }
  - { gpio: 17, pad_name: U0RXD,      fn0: U0RXD,      fn1: GPIO17 }
  - { gpio: 18, pad_name: GPIO18,     fn0: GPIO18,     fn1: GPIO18 }
  - { gpio: 19, pad_name: GPIO19,     fn0: GPIO19,     fn1: GPIO19 }
  - { gpio: 20, pad_name: GPIO20,     fn0: GPIO20,     fn1: GPIO20 }
  - { gpio: 21, pad_name: GPIO21,     fn0: GPIO21,     fn1: GPIO21 }
  - { gpio: 22, pad_name: GPIO22,     fn0: GPIO22,     fn1: GPIO22 }
  - { gpio: 23, pad_name: GPIO23,     fn0: GPIO23,     fn1: GPIO23 }
  - { gpio: 24, pad_name: SPICS0,     fn0: SPICS0,     fn1: GPIO24, flash_reserved: true }
  - { gpio: 25, pad_name: SPIQ,       fn0: SPIQ,       fn1: GPIO25, flash_reserved: true }
  - { gpio: 26, pad_name: SPIWP,      fn0: SPIWP,      fn1: GPIO26, flash_reserved: true }
  - { gpio: 27, pad_name: GPIO27,     fn0: GPIO27,     fn1: GPIO27 }
  - { gpio: 28, pad_name: SPIHD,      fn0: SPIHD,      fn1: GPIO28, flash_reserved: true }
  - { gpio: 29, pad_name: SPICLK,     fn0: SPICLK,     fn1: GPIO29, flash_reserved: true }
  - { gpio: 30, pad_name: SPID,       fn0: SPID,       fn1: GPIO30, flash_reserved: true }

gpio_matrix:
  - { id: 0,  name: ledc_ls_sig_out0, direction: out }
  - { id: 1,  name: ledc_ls_sig_out1, direction: out }
  - { id: 2,  name: ledc_ls_sig_out2, direction: out }
  - { id: 3,  name: ledc_ls_sig_out3, direction: out }
  - { id: 4,  name: ledc_ls_sig_out4, direction: out }
  - { id: 5,  name: ledc_ls_sig_out5, direction: out }
  - { id: 6,  name: U0TXD_out,        direction: out }
  - { id: 9,  name: U1TXD_out,        direction: out }
  - { id: 45, name: I2CEXT0_SCL,      direction: inout }
  - { id: 46, name: I2CEXT0_SDA,      direction: inout }

# Linker layout — which memory regions back the riscv-rt / esp-riscv-rt
# aliases for the bsp_pac flashable path.
linker:
  region_text: flash_cache
  region_data: hp_sram
