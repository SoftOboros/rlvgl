# Silicon Labs EFM32GG11 (Giant Gecko 11) chip inventory IR.
#
# Source — primary:
#   • EFM32GG11 Family Reference Manual (Silicon Labs, EFM32GG11-RM)
#     — section names cited inline below; the RM is the authoritative
#     source for register-block names and CMU branch tree.
#   • EFM32GG11 Family Data Sheet rev 1.2 — Ordering Information
#     (Table 2.1) for SKU package + GPIO count, and Feature List for
#     CPU frequency (Cortex-M4F at up to 72 MHz).
#
# Source — corroborating (used to cross-check peripheral base
# addresses and IRQ numbers against the RM):
#   • CMSIS device header `efm32gg11b820f2048gl192.h` (ARMmbed
#     mbed-os, derived from Silicon Labs Gecko SDK).
#   • `efm32gg11b-pac` v0.1.4 generated by svd2rust 0.28.0 from the
#     Silicon Labs SVD. Register/field names below match this PAC's
#     accessor surface verbatim (e.g. `cmu.hfperclken0`,
#     `usart0.routeloc0`, `usart0.routepen`, `gpio.pa_modeh`).
#
# Modelled SKU (canonical for CHIPS-SILABS-01a):
#   EFM32GG11B820F2048GL192 — 2048 KB flash, 512 KB SRAM, 144 GPIO,
#   BGA192 package, full feature set (USB, Ethernet, QSPI, SDIO,
#   LCD, CAN, DC-DC). The pac_crate's `efm32gg11b820` feature flag
#   selects this variant; sibling SKUs in the same family (e.g.
#   EFM32GG11B520F2048GL120) share the same register-block layout
#   and reuse this chip YAML by simply pinning a different PAC
#   feature flag at the consumer's `Cargo.toml`.

name: EFM32GG11
arch: cortex-m4f
package: BGA192
pac_crate: efm32gg11b-pac
# `efm32gg11b-pac` 0.1.4 (svd2rust 0.28.0) gates the per-SKU
# `Peripherals` type behind a SKU sub-module
# (`efm32gg11b_pac::efm32gg11b820::Peripherals`) rather than
# re-exporting it at the crate root. The BSP template flattens this
# sub-module into the `pac` namespace via
# `pub use efm32gg11b_pac::efm32gg11b820::*;` so the generated
# `pac::Peripherals::steal()` call site continues to resolve.
pac_sku_module: efm32gg11b820
gpio_count: 144

# routing_kind: §10.2 frozen enum. EFM32GG11 is Series 1 — uses the
# per-peripheral ROUTELOC mechanism (each peripheral has its own
# `<PERIPH>_ROUTELOC0/1` register selecting a fixed pin location and
# a `<PERIPH>_ROUTEPEN` gate). See RM "GPIO — General Purpose
# Input/Output" §32.5 "I/O Configuration and Routing".
routing_kind: routeloc

memory:
  # EFM32GG11 RM "System Overview / Memory Map". Flash main block
  # is mapped at 0x0 with the Cortex-M4 alias; SRAM at 0x20000000.
  # Sizes for the EFM32GG11B820F2048GL192 SKU (Data Sheet Table 2.1).
  - { name: flash,    base: 0x00000000, size: 0x00200000, access: rx  }   # 2048 KB main flash
  - { name: sram,     base: 0x20000000, size: 0x00080000, access: rwx }   # 512 KB SRAM
  # Information block (lockbits + user data). RM "Memory System
  # Controller (MSC)" §9.3 Table — User Data page, Lock Bits page,
  # and DEVINFO are mapped under 0x0FE00000.
  - { name: userdata, base: 0x0FE00000, size: 0x00000800, access: rw  }   # User Data page (2 KB)
  - { name: lockbits, base: 0x0FE04000, size: 0x00000800, access: rw  }   # Lock Bits page (2 KB)
  - { name: devinfo,  base: 0x0FE08000, size: 0x00000800, access: r   }   # Device Information page (read-only)

clock_tree:
  # Oscillators per RM "Clock Management Unit (CMU)" — Oscillators
  # subsection. The four crystal/RC oscillators on EFM32GG11 are
  # HFXO (external high-freq crystal), HFRCO (internal high-freq RC),
  # AUXHFRCO (auxiliary HF RC used for flash programming + SWO),
  # LFXO (external 32.768 kHz crystal), LFRCO (internal 32.768 kHz RC),
  # and USHFRCO (USB-dedicated 48 MHz RC, used when USB is enabled).
  hfxo_hz:       50000000   # SLSTK3701A starter kit uses 50 MHz HFXO; HFXO range per RM is 4-50 MHz
  hfrco_hz:      19000000   # HFRCO factory-default frequency band (RM CMU §); tunable to 1/2/4/7/13/16/19/26/32/38/48/56/64/72 MHz
  auxhfrco_hz:   19000000   # AUXHFRCO factory default (same band set as HFRCO)
  lfxo_hz:       32768      # LFXO crystal (when fitted)
  lfrco_hz:      32768      # LFRCO RC
  ushfrco_hz:    48000000   # USHFRCO for USB (off until enabled)
  hfclk_hz:      50000000   # HFCLK after init() — switched to HFXO; CPU @ HFCLK
  cpu_hz:        50000000   # CPU clock after init() (EFM32GG11 max is 72 MHz via HFRCO 72 MHz band; HFXO bring-up here keeps board-XTAL ratio)

  # Per-peripheral clock-gate map. Mirrors the ESP `system_gates`
  # shape (§3 glossary). Each row drives the `clocks.rs.jinja`
  # template's per-peripheral CMU bring-up.
  #
  # On EFM32GG11 (Series 1) peripheral clock gating lives in the
  # CMU block in three register families:
  #   • cmu.hfperclken0 / cmu.hfperclken1 — HF peripheral bus
  #     (USART, UART, I2C, TIMER, ADC, ACMP, IDAC, VDAC, PRS, CSEN,
  #     LESENSE, CRYOTIMER, GPIO).
  #   • cmu.hfbusclken0 — HF system bus (LDMA, GPCRC, EBI, ETH,
  #     CRYPTO, SDIO, QSPI, LE — wakeup gate to LF peripherals).
  #   • cmu.lfaclken0 / cmu.lfbclken0 / cmu.lfeclken0 — LF
  #     peripheral buses (LETIMER, LEUART, RTC, RTCC, PCNT, LCD,
  #     WDOG).
  # See RM "Clock Management Unit (CMU)" §11 register descriptions
  # for the exact bit positions; PAC field names match svd2rust
  # snake_case forms of the SVD field IDs.
  #
  # EFM32GG11 does NOT have a per-peripheral CMU reset register;
  # reset is via the RMU block or the peripheral's own CMD/CTRL
  # write. `rst_reg` / `rst_field` are therefore null and the
  # `clocks.rs.jinja` template MUST emit clock-enable only, with
  # peripheral-side reset deferred to the `peripherals.rs.jinja`
  # arm. This matches RM "Reset Management Unit (RMU)" §10 which
  # documents RMU as soft-reset only (no per-peripheral reset).
  system_gates:
    usart0:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: usart0
      rst_reg:      null
      rst_field:    null
    usart1:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: usart1
      rst_reg:      null
      rst_field:    null
    usart2:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: usart2
      rst_reg:      null
      rst_field:    null
    usart3:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: usart3
      rst_reg:      null
      rst_field:    null
    usart4:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: usart4
      rst_reg:      null
      rst_field:    null
    usart5:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: usart5
      rst_reg:      null
      rst_field:    null
    uart0:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: uart0
      rst_reg:      null
      rst_field:    null
    uart1:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: uart1
      rst_reg:      null
      rst_field:    null
    leuart0:
      # LEUART is on the LFB clock branch — must also be ungated
      # via cmu.hfbusclken0.le (HF↔LF bridge) by the template's
      # LF-init prologue.
      clk_en_reg:   cmu.lfbclken0
      clk_en_field: leuart0
      rst_reg:      null
      rst_field:    null
    leuart1:
      clk_en_reg:   cmu.lfbclken0
      clk_en_field: leuart1
      rst_reg:      null
      rst_field:    null
    i2c0:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: i2c0
      rst_reg:      null
      rst_field:    null
    i2c1:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: i2c1
      rst_reg:      null
      rst_field:    null
    i2c2:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: i2c2
      rst_reg:      null
      rst_field:    null
    timer0:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: timer0
      rst_reg:      null
      rst_field:    null
    timer1:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: timer1
      rst_reg:      null
      rst_field:    null
    timer2:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: timer2
      rst_reg:      null
      rst_field:    null
    timer3:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: timer3
      rst_reg:      null
      rst_field:    null
    timer4:
      clk_en_reg:   cmu.hfperclken1
      clk_en_field: timer4
      rst_reg:      null
      rst_field:    null
    timer5:
      clk_en_reg:   cmu.hfperclken1
      clk_en_field: timer5
      rst_reg:      null
      rst_field:    null
    timer6:
      clk_en_reg:   cmu.hfperclken1
      clk_en_field: timer6
      rst_reg:      null
      rst_field:    null
    wtimer0:
      clk_en_reg:   cmu.hfperclken1
      clk_en_field: wtimer0
      rst_reg:      null
      rst_field:    null
    wtimer1:
      clk_en_reg:   cmu.hfperclken1
      clk_en_field: wtimer1
      rst_reg:      null
      rst_field:    null
    gpio:
      # GPIO is always-on for register access but the CMU gate is
      # still needed for input-glitch-filter clocks and asynchronous
      # interrupt path. RM CMU §11 HFPERCLKEN0.GPIO.
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: gpio
      rst_reg:      null
      rst_field:    null
    prs:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: prs
      rst_reg:      null
      rst_field:    null
    ldma:
      clk_en_reg:   cmu.hfbusclken0
      clk_en_field: ldma
      rst_reg:      null
      rst_field:    null
    le:
      # LE wakeup gate — must be ungated before any LF peripheral
      # (LEUART, LETIMER, RTC, RTCC, PCNT, LCD, WDOG) is accessed.
      clk_en_reg:   cmu.hfbusclken0
      clk_en_field: le
      rst_reg:      null
      rst_field:    null
    letimer0:
      clk_en_reg:   cmu.lfaclken0
      clk_en_field: letimer0
      rst_reg:      null
      rst_field:    null
    letimer1:
      clk_en_reg:   cmu.lfaclken0
      clk_en_field: letimer1
      rst_reg:      null
      rst_field:    null
    rtcc:
      clk_en_reg:   cmu.lfeclken0
      clk_en_field: rtcc
      rst_reg:      null
      rst_field:    null
    rtc:
      clk_en_reg:   cmu.lfaclken0
      clk_en_field: rtc
      rst_reg:      null
      rst_field:    null
    wdog0:
      clk_en_reg:   cmu.lfaclken0
      clk_en_field: wdog0
      rst_reg:      null
      rst_field:    null
    wdog1:
      clk_en_reg:   cmu.lfaclken0
      clk_en_field: wdog1
      rst_reg:      null
      rst_field:    null
    adc0:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: adc0
      rst_reg:      null
      rst_field:    null
    adc1:
      clk_en_reg:   cmu.hfperclken0
      clk_en_field: adc1
      rst_reg:      null
      rst_field:    null

peripherals:
  # Base addresses cross-checked against CMSIS header
  # `efm32gg11b820f2048gl192.h`. IRQ numbers from the same header's
  # IRQn_Type enum. PAC instance names match the
  # `efm32gg11b-pac::Peripherals` field names.
  #
  # ROUTELOC encoding (Series 1, §10.2):
  #   • route_reg = `<periph>.routeloc0` (TX/RX/CLK/CS) or
  #                 `<periph>.routeloc1` (CTS/RTS/aux signals).
  #   • route_field = `<role>loc` (e.g. txloc, rxloc, clkloc).
  #   • pen_reg = `<periph>.routepen`.
  #   • pen_field = `<role>pen` (e.g. txpen, rxpen, clkpen).
  # The concrete LOC value (0..31) is per-board; chip YAML names
  # the *register/field path*, board YAML supplies the LOC integer.
  # See RM "Universal Synchronous Asynchronous Receiver/Transmitter
  # (USART)" §33.5 register descriptions for the per-LOC pin map.

  cmu:
    class: cmu
    instance: cmu
    base: 0x400E4000
    irq: 32           # CMU_IRQn
    signals: []
  emu:
    class: emu
    instance: emu
    base: 0x400E3000
    irq: 0            # EMU_IRQn
    signals: []
  rmu:
    class: rmu
    instance: rmu
    base: 0x400E5000
    irq: null
    signals: []
  msc:
    class: msc
    instance: msc
    base: 0x40000000
    irq: 33           # MSC_IRQn
    signals: []
  gpio:
    class: gpio
    instance: gpio
    base: 0x40088000
    # GPIO uses two interrupt lines: EVEN (pins 0,2,4,...) and ODD
    # (pins 1,3,5,...). Surfaced as `irq:` (EVEN) plus a sidecar
    # `irq_odd:` so the template can emit both NVIC unmask calls.
    irq: 3            # GPIO_EVEN_IRQn
    irq_odd: 13       # GPIO_ODD_IRQn
    signals: []
  ldma:
    class: ldma
    instance: ldma
    base: 0x40002000
    irq: 2            # LDMA_IRQn
    signals: []

  usart0:
    class: usart
    instance: usart0
    base: 0x40010000
    irq: 6            # USART0_RX_IRQn (TX on 7)
    irq_tx: 7         # USART0_TX_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: usart0.routeloc0, route_field: txloc,
          pen_reg:   usart0.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: usart0.routeloc0, route_field: rxloc,
          pen_reg:   usart0.routepen,  pen_field:   rxpen }
      - { role: clk, direction: out,
          route_reg: usart0.routeloc0, route_field: clkloc,
          pen_reg:   usart0.routepen,  pen_field:   clkpen }
      - { role: cs,  direction: out,
          route_reg: usart0.routeloc0, route_field: csloc,
          pen_reg:   usart0.routepen,  pen_field:   cspen }
      - { role: cts, direction: in,
          route_reg: usart0.routeloc1, route_field: ctsloc,
          pen_reg:   usart0.routepen,  pen_field:   ctspen }
      - { role: rts, direction: out,
          route_reg: usart0.routeloc1, route_field: rtsloc,
          pen_reg:   usart0.routepen,  pen_field:   rtspen }
  usart1:
    class: usart
    instance: usart1
    base: 0x40010400
    irq: 17           # USART1_RX_IRQn
    irq_tx: 18        # USART1_TX_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: usart1.routeloc0, route_field: txloc,
          pen_reg:   usart1.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: usart1.routeloc0, route_field: rxloc,
          pen_reg:   usart1.routepen,  pen_field:   rxpen }
      - { role: clk, direction: out,
          route_reg: usart1.routeloc0, route_field: clkloc,
          pen_reg:   usart1.routepen,  pen_field:   clkpen }
      - { role: cs,  direction: out,
          route_reg: usart1.routeloc0, route_field: csloc,
          pen_reg:   usart1.routepen,  pen_field:   cspen }
  usart2:
    class: usart
    instance: usart2
    base: 0x40010800
    irq: 19           # USART2_RX_IRQn
    irq_tx: 20        # USART2_TX_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: usart2.routeloc0, route_field: txloc,
          pen_reg:   usart2.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: usart2.routeloc0, route_field: rxloc,
          pen_reg:   usart2.routepen,  pen_field:   rxpen }
      - { role: clk, direction: out,
          route_reg: usart2.routeloc0, route_field: clkloc,
          pen_reg:   usart2.routepen,  pen_field:   clkpen }
      - { role: cs,  direction: out,
          route_reg: usart2.routeloc0, route_field: csloc,
          pen_reg:   usart2.routepen,  pen_field:   cspen }
  usart3:
    class: usart
    instance: usart3
    base: 0x40010C00
    irq: 37           # USART3_RX_IRQn
    irq_tx: 38        # USART3_TX_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: usart3.routeloc0, route_field: txloc,
          pen_reg:   usart3.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: usart3.routeloc0, route_field: rxloc,
          pen_reg:   usart3.routepen,  pen_field:   rxpen }
      - { role: clk, direction: out,
          route_reg: usart3.routeloc0, route_field: clkloc,
          pen_reg:   usart3.routepen,  pen_field:   clkpen }
      - { role: cs,  direction: out,
          route_reg: usart3.routeloc0, route_field: csloc,
          pen_reg:   usart3.routepen,  pen_field:   cspen }
  usart4:
    class: usart
    instance: usart4
    base: 0x40011000
    irq: 39           # USART4_RX_IRQn
    irq_tx: 40        # USART4_TX_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: usart4.routeloc0, route_field: txloc,
          pen_reg:   usart4.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: usart4.routeloc0, route_field: rxloc,
          pen_reg:   usart4.routepen,  pen_field:   rxpen }
      - { role: clk, direction: out,
          route_reg: usart4.routeloc0, route_field: clkloc,
          pen_reg:   usart4.routepen,  pen_field:   clkpen }
      - { role: cs,  direction: out,
          route_reg: usart4.routeloc0, route_field: csloc,
          pen_reg:   usart4.routepen,  pen_field:   cspen }
  usart5:
    class: usart
    instance: usart5
    base: 0x40011400
    irq: 50           # USART5_RX_IRQn
    irq_tx: 51        # USART5_TX_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: usart5.routeloc0, route_field: txloc,
          pen_reg:   usart5.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: usart5.routeloc0, route_field: rxloc,
          pen_reg:   usart5.routepen,  pen_field:   rxpen }
      - { role: clk, direction: out,
          route_reg: usart5.routeloc0, route_field: clkloc,
          pen_reg:   usart5.routepen,  pen_field:   clkpen }
      - { role: cs,  direction: out,
          route_reg: usart5.routeloc0, route_field: csloc,
          pen_reg:   usart5.routepen,  pen_field:   cspen }

  uart0:
    # EFM32GG11 retains UART0/UART1 as Series-0-compatible plain
    # async UARTs. RM "Universal Asynchronous Receiver/Transmitter
    # (UART)" — register-block layout is a strict subset of USART.
    class: uart
    instance: uart0
    base: 0x40014000
    irq: 21           # UART0_RX_IRQn
    irq_tx: 22        # UART0_TX_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: uart0.routeloc0, route_field: txloc,
          pen_reg:   uart0.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: uart0.routeloc0, route_field: rxloc,
          pen_reg:   uart0.routepen,  pen_field:   rxpen }
  uart1:
    class: uart
    instance: uart1
    base: 0x40014400
    irq: 23           # UART1_RX_IRQn
    irq_tx: 24        # UART1_TX_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: uart1.routeloc0, route_field: txloc,
          pen_reg:   uart1.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: uart1.routeloc0, route_field: rxloc,
          pen_reg:   uart1.routepen,  pen_field:   rxpen }

  leuart0:
    # Low-Energy UART. RM "Low Energy UART (LEUART)" — clocked from
    # LFB branch; routable via leuart0.routeloc0 / .routepen.
    class: leuart
    instance: leuart0
    base: 0x4006A000
    irq: 25           # LEUART0_IRQn (single combined IRQ)
    signals:
      - { role: tx,  direction: out,
          route_reg: leuart0.routeloc0, route_field: txloc,
          pen_reg:   leuart0.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: leuart0.routeloc0, route_field: rxloc,
          pen_reg:   leuart0.routepen,  pen_field:   rxpen }
  leuart1:
    class: leuart
    instance: leuart1
    base: 0x4006A400
    irq: 26           # LEUART1_IRQn
    signals:
      - { role: tx,  direction: out,
          route_reg: leuart1.routeloc0, route_field: txloc,
          pen_reg:   leuart1.routepen,  pen_field:   txpen }
      - { role: rx,  direction: in,
          route_reg: leuart1.routeloc0, route_field: rxloc,
          pen_reg:   leuart1.routepen,  pen_field:   rxpen }

  i2c0:
    # RM "I2C - Inter-Integrated Circuit Interface" — three I2C
    # masters on EFM32GG11 (i2c0/i2c1/i2c2). Each has a single
    # combined IRQ, routable via i2c<n>.routeloc0 / .routepen.
    class: i2c
    instance: i2c0
    base: 0x40089000
    irq: 11           # I2C0_IRQn
    signals:
      - { role: scl, direction: inout,
          route_reg: i2c0.routeloc0, route_field: sclloc,
          pen_reg:   i2c0.routepen,  pen_field:   sclpen }
      - { role: sda, direction: inout,
          route_reg: i2c0.routeloc0, route_field: sdaloc,
          pen_reg:   i2c0.routepen,  pen_field:   sdapen }
  i2c1:
    class: i2c
    instance: i2c1
    base: 0x40089400
    irq: 12           # I2C1_IRQn
    signals:
      - { role: scl, direction: inout,
          route_reg: i2c1.routeloc0, route_field: sclloc,
          pen_reg:   i2c1.routepen,  pen_field:   sclpen }
      - { role: sda, direction: inout,
          route_reg: i2c1.routeloc0, route_field: sdaloc,
          pen_reg:   i2c1.routepen,  pen_field:   sdapen }
  i2c2:
    class: i2c
    instance: i2c2
    base: 0x40089800
    irq: 45           # I2C2_IRQn
    signals:
      - { role: scl, direction: inout,
          route_reg: i2c2.routeloc0, route_field: sclloc,
          pen_reg:   i2c2.routepen,  pen_field:   sclpen }
      - { role: sda, direction: inout,
          route_reg: i2c2.routeloc0, route_field: sdaloc,
          pen_reg:   i2c2.routepen,  pen_field:   sdapen }

  timer0:
    # RM "Timer/Counter (TIMER)" — TIMER0..TIMER6 are 16-bit timers
    # with 3 CC channels (TIMER1 has 4); WTIMER0..WTIMER3 are 32-bit
    # variants. Both share the same register-block layout.
    class: timer
    instance: timer0
    base: 0x40018000
    irq: 5            # TIMER0_IRQn
    signals:
      - { role: cc0, direction: out,
          route_reg: timer0.routeloc0, route_field: cc0loc,
          pen_reg:   timer0.routepen,  pen_field:   cc0pen }
      - { role: cc1, direction: out,
          route_reg: timer0.routeloc0, route_field: cc1loc,
          pen_reg:   timer0.routepen,  pen_field:   cc1pen }
      - { role: cc2, direction: out,
          route_reg: timer0.routeloc0, route_field: cc2loc,
          pen_reg:   timer0.routepen,  pen_field:   cc2pen }
  timer1:
    class: timer
    instance: timer1
    base: 0x40018400
    irq: 14           # TIMER1_IRQn
    signals: []
  timer2:
    class: timer
    instance: timer2
    base: 0x40018800
    irq: 15           # TIMER2_IRQn
    signals: []
  timer3:
    class: timer
    instance: timer3
    base: 0x40018C00
    irq: 16           # TIMER3_IRQn
    signals: []
  timer4:
    class: timer
    instance: timer4
    base: 0x40019000
    irq: 47           # TIMER4_IRQn
    signals: []
  timer5:
    class: timer
    instance: timer5
    base: 0x40019400
    irq: 48           # TIMER5_IRQn
    signals: []
  timer6:
    class: timer
    instance: timer6
    base: 0x40019800
    irq: 49           # TIMER6_IRQn
    signals: []
  wtimer0:
    class: timer
    instance: wtimer0
    base: 0x4001A000
    irq: 41           # WTIMER0_IRQn
    signals: []
  wtimer1:
    class: timer
    instance: wtimer1
    base: 0x4001A400
    irq: 42           # WTIMER1_IRQn
    signals: []

  letimer0:
    class: letimer
    instance: letimer0
    base: 0x40066000
    irq: 27           # LETIMER0_IRQn
    signals: []
  letimer1:
    class: letimer
    instance: letimer1
    base: 0x40066400
    irq: 65           # LETIMER1_IRQn
    signals: []

  wdog0:
    # RM "Watchdog Timer (WDOG)". On EFM32GG11 WDOG_CTRL has a
    # ~3 LFRCO-cycle synchronisation latency after disable. The
    # template MUST honour this (CLAUDE.md / §9 INV-SL5).
    class: wdog
    instance: wdog0
    base: 0x40052000
    irq: 1            # WDOG0_IRQn
    signals: []
  wdog1:
    class: wdog
    instance: wdog1
    base: 0x40052400
    irq: 64           # WDOG1_IRQn
    signals: []

  rtc:
    class: rtc
    instance: rtc
    base: 0x40060000
    irq: 63           # RTC_IRQn
    signals: []
  rtcc:
    class: rtcc
    instance: rtcc
    base: 0x40062000
    irq: 31           # RTCC_IRQn
    signals: []
  cryotimer:
    class: cryotimer
    instance: cryotimer
    base: 0x4008F000
    irq: 35           # CRYOTIMER_IRQn
    signals: []

  adc0:
    class: adc
    instance: adc0
    base: 0x40082000
    irq: 9            # ADC0_IRQn
    signals: []
  adc1:
    class: adc
    instance: adc1
    base: 0x40082400
    irq: 56           # ADC1_IRQn
    signals: []
  vdac0:
    class: dac
    instance: vdac0
    base: 0x40086000
    irq: 46           # VDAC0_IRQn
    signals: []
  idac0:
    class: dac
    instance: idac0
    base: 0x40084000
    irq: 10           # IDAC0_IRQn
    signals: []

# GPIO port + pin inventory. EFM32GG11 BGA192 (GL192 suffix) exposes
# all nine ports A–I; 144 GPIOs total. Smaller packages (BGA152,
# BGA120, QFP100, QFN64) bond out a strict subset; consumer-side
# board YAML pin assignments MUST stay within the bonded subset for
# the chosen SKU. RM "GPIO" §32 pinout tables list per-package
# bonding.
gpio:
  ports: [A, B, C, D, E, F, G, H, I]
  pins_per_port:
    A: 16
    B: 16
    C: 16
    D: 16
    E: 16
    F: 16
    G: 16
    H: 16
    I: 16

# Linker hints. Mirrors the ESP `linker:` shape; consumed by a
# future `CHIPS-SILABS-05` sub-letter that emits `memory.x`. Until
# then the consuming example crate provides its own linker script
# (§11 deferred-non-goal).
linker:
  region_text: flash
  region_data: sram
