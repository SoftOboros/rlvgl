# Configuration for rlvgl-chips-nxp crate.
[package]
name = "rlvgl-chips-nxp"
version = "0.2.0"
authors = ["Ira Abbott <ira@softoboros.com>"]
edition = "2021"
license = "MIT"
description = "NXP chip database adapter for rlvgl code generation."
publish = true
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl-chips-nxp"
keywords = ["embedded", "nxp", "mcu", "chipdb", "no_std"]
categories = ["config", "embedded"]

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = ["dep:serde", "dep:serde_yaml", "dep:indexmap"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_yaml = { version = "0.9", optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
