# Linker region naming aliases (§5 chip-inventory table). The
# `cortex-m-rt`-shaped `link.x.in` consumes regions named FLASH and
# RAM; the `memory.x` template emits these aliases on top of the
# `memory:` entries above. Per §5 chip-inventory table: matches the
# Cortex-M-RT convention exactly.
linker:
  region_text: flash
  region_data: ram
