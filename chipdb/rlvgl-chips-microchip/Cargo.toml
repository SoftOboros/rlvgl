# Configuration for rlvgl-chips-microchip crate.
[package]
name = "rlvgl-chips-microchip"
version = "0.2.1"
authors = ["Ira Abbott <ira@softoboros.com>"]
edition = "2021"
license = "MIT"
description = "Microchip chip database adapter for rlvgl code generation."
publish = true
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl-chips-microchip"
keywords = ["embedded", "microchip", "mcu", "chipdb", "no_std"]
categories = ["config", "embedded"]

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
