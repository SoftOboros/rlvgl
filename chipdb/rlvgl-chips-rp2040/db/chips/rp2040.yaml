  - { gpio: 22, funcs: [{ sel: 1, func: SPI0_SCK  }, { sel: 2, func: UART1_CTS }, { sel: 3, func: I2C1_SDA }, { sel: 4, func: PWM3_A  }, { sel: 5, func: SIO }, { sel: 6, func: PIO0 }, { sel: 7, func: PIO1 }, { sel: 8, func: CLOCK_GPIN1  }] }
