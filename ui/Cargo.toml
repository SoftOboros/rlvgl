# SPDX-License-Identifier: MIT
# rlvgl-ui crate manifest.

[package]
name = "rlvgl-ui"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "High-level UI components and theming for rlvgl."
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl-ui"

[dependencies]
rlvgl-core = { path = "../core", version = "0.2.0", default-features = false }
rlvgl-widgets = { path = "../widgets", version = "0.2.0", default-features = false }

[features]
view = []
default = []
