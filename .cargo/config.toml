# .cargo/config.toml
[target.thumbv7em-none-eabihf]
# Use the example-local build.rs to stage and pass the linker script.
# Avoid injecting an unspecified linker script via env here, as it can
# override cortex-m-rt's link.x and break the vector table/entry point.
# target-cpu=cortex-m7 enables DSP extensions and the faster multiplier.
# Note: must use RUSTFLAGS="" to override global mold linker setting.
rustflags = []

[target.armv7-unknown-linux-gnueabihf]
# BeagleBone Black + NHD cape target. macOS cross toolchain from the
# messense/macos-cross-toolchains brew tap.
linker = "armv7-unknown-linux-gnueabihf-gcc"
