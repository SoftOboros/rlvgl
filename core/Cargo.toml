[package]
name = "rlvgl-core"
version = "0.2.3"
authors = ["Ira Abbott <ira@softobotos.com>"]
edition = "2024"
license = "MIT"
description = "Core runtime, widget tree, renderer, style, and plugin interfaces for rlvgl."
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl-core"
keywords = ["embedded", "graphics", "ui", "lvgl", "no_std"]
categories = ["embedded", "gui", "no-std", "graphics"]
publish = true

[dependencies]
gif = { version = "0.13", optional = true }
embedded-canvas = { version = "0.3.1", default-features = true, optional = true }
embedded-graphics = { version = "0.8", optional = true }
fatfs = { version = "0.3", optional = true }
fscommon = { version = "0.1", optional = true }
yane = { version = "1", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rlottie = { version = "0.5.2", optional = true }

[target.'cfg(not(target_os = "none"))'.dependencies]
png = { version = "0.17", default-features = false, optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
once_cell = { version = "1.19", optional = true }
blake3 = { version = "1.5", default-features = false, optional = true }
jpeg-decoder = { version = "0.3", default-features = false, optional = true }
fontdue = { version = "0.9.3", default-features = false, optional = true }

[features]
default = []
png = ["dep:png"]
jpeg = ["dep:jpeg-decoder"]
gif = ["dep:gif"]
qrcode = ["dep:qrcode"]
fontdue = ["dep:fontdue", "dep:once_cell", "dep:blake3"]
lottie = []
lottie_backend = ["dep:rlottie"]
canvas = ["dep:embedded-canvas", "dep:embedded-graphics"]
pinyin = []
fatfs = ["dep:fatfs", "dep:fscommon"]
nes = ["dep:yane"]
apng = ["dep:image"]
fs = []

[dev-dependencies]
rlvgl-widgets = { version = "0.2.0", path = "../widgets" }
doc-comment = "0.3"
base64 = "0.22"
apng = "0.3"
png = "0.17"

[package.metadata.docs.rs]
features = ["png", "jpeg", "gif", "qrcode", "fontdue", "lottie", "canvas", "pinyin", "fatfs", "nes", "apng", "fs"]
rustdoc-args = ["--cfg", "docsrs", "--cfg", "nightly"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(nightly)"] }
