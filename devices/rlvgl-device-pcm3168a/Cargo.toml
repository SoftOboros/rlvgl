[package]
name = "rlvgl-device-pcm3168a"
version = "0.2.5"
authors = ["Ira Abbott <ira@softoboros.com>"]
edition = "2024"
license = "MIT"
description = "No-std embedded-hal control-plane driver for the TI PCM3168A audio codec."
