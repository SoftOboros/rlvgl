[package]
name = "rlvgl"
version = "0.2.4"
authors = ["Ira Abbott <ira@softoboros.com>"]
edition = "2024"
license = "MIT"
description = "A modular, idiomatic Rust reimplementation of the LVGL graphics library for embedded and simulator use."
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl"
keywords = ["embedded", "graphics", "ui", "lvgl", "no_std"]
categories = ["embedded", "gui", "no-std", "graphics"]
publish = true
include = [
  "/.cargo/config.toml",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/README-CREATOR.md",
  "/LICENSE",
  "/NOTICES.md",
  "/CODE_OF_CONDUCT.md",
  "/build.rs",
  "/rlvgl-logo.png",
  "/src/**",
  "/tests/**",
  "/examples/sim/src/main.rs",
  "/examples/stm32h747i-disco/src/**/*.rs",
  "/examples/stm32h747i-disco/assets/fonts/**",
  "/examples/stm32h747i-disco/assets/icons/**",
  "/examples/stm32h747i-disco/assets/media/**",
  "/examples/stm32h747i-disco/assets/manifest.yml",
  "/examples/stm32h747i-disco/memory.x",
  "/examples/stm32h747i-disco/memory_cm4.x",
  "/examples/stm32h747i-disco/memory_STM32H747XI.x"
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rlvgl-creator"
path = "src/bin/rlvgl_creator/main.rs"
required-features = ["creator"]
doc = false

[[test]]
name = "creator_new"
path = "tests/creator_new.rs"
required-features = ["creator"]

[[test]]
name = "creator_run"
path = "tests/creator_run.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_ingest"
path = "tests/creator_qt_ingest.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_compile"
path = "tests/creator_qt_emit_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_rlvgl_compile"
path = "tests/creator_qt_emit_rlvgl_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_clickable_compile"
path = "tests/creator_qt_emit_clickable_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_counter_compile"
path = "tests/creator_qt_emit_counter_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_bound_text_compile"
path = "tests/creator_qt_emit_bound_text_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_centered_compile"
path = "tests/creator_qt_emit_centered_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_nested_compile"
path = "tests/creator_qt_emit_nested_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_edges_compile"
path = "tests/creator_qt_emit_edges_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_corners_compile"
path = "tests/creator_qt_emit_corners_compile.rs"
required-features = ["creator"]

[[test]]
name = "creator_qt_emit_mousearea_compile"
path = "tests/creator_qt_emit_mousearea_compile.rs"
required-features = ["creator"]

# QT-05b: stopwatch dispatch-glue compile-as-mod gate. Depends on the
# `stopwatch_gen` dev-dep (mock istate-codegen output) per QT-05b §8.
[[test]]
name = "creator_qt_emit_stopwatch_compile"
path = "tests/creator_qt_emit_stopwatch_compile.rs"
required-features = ["creator"]

# QT-10: strict-mode meta-test. Asserts the chapter file set, version
# constants, and CLI subcommand surface remain stable.
[[test]]
name = "creator_qt_strict_mode"
path = "tests/creator_qt_strict_mode.rs"
required-features = ["creator"]

# CRATES-CI-03: kittest Layer K. Drives CreatorApp in-process via the
# egui_kittest accesskit harness — no display server (INV-C5). The
# snapshot under tests/snapshots/ is compared with an explicit
# threshold, never bit-exact (INV-C4).
[[test]]
name = "creator_ui_kittest"
path = "tests/creator_ui_kittest.rs"
required-features = ["creator", "creator_ui"]

[dependencies]
rlvgl-core = { version = "0.2.4", path = "core", default-features = false }
rlvgl-widgets = { version = "0.2.4", path = "widgets", default-features = false }
rlvgl-platform = { version = "0.2.4", path = "platform", default-features = false }
