[package]
name = "rlvgl"
version = "0.2.0"
authors = ["Ira Abbott <ira@softoboros.com>"]
edition = "2024"
license = "MIT"
description = "A modular, idiomatic Rust reimplementation of the LVGL graphics library for embedded and simulator use."
readme = "README.md"
repository = "https://github.com/softoboros/rlvgl"
homepage = "https://github.com/softoboros/rlvgl"
documentation = "https://docs.rs/rlvgl"
keywords = ["embedded", "graphics", "ui", "lvgl", "no_std"]
categories = ["embedded", "gui", "no-std", "graphics"]
publish = true
include = [
  "/.cargo/config.toml",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/README-CREATOR.md",
  "/LICENSE",
  "/NOTICES.md",
  "/CODE_OF_CONDUCT.md",
  "/build.rs",
  "/rlvgl-logo.png",
  "/src/**",
  "/tests/**",
  "/examples/sim/src/main.rs",
  "/examples/stm32h747i-disco/src/**/*.rs",
  "/examples/stm32h747i-disco/assets/fonts/**",
  "/examples/stm32h747i-disco/assets/icons/**",
  "/examples/stm32h747i-disco/assets/media/**",
  "/examples/stm32h747i-disco/assets/manifest.yml",
  "/examples/stm32h747i-disco/memory.x",
  "/examples/stm32h747i-disco/memory_cm4.x",
  "/examples/stm32h747i-disco/memory_STM32H747XI.x"
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rlvgl-creator"
path = "src/bin/rlvgl_creator/main.rs"
required-features = ["creator"]
doc = false

[[test]]
name = "creator_new"
path = "tests/creator_new.rs"
required-features = ["creator"]

[[test]]
name = "creator_run"
path = "tests/creator_run.rs"
required-features = ["creator"]

[dependencies]
rlvgl-core = { version = "0.2.0", path = "core", default-features = false }
rlvgl-widgets = { version = "0.2.0", path = "widgets", default-features = false }
rlvgl-platform = { version = "0.2.0", path = "platform", default-features = false }
rlvgl-ui = { version = "0.2.0", path = "ui", default-features = false }
rlvgl-i18n = { version = "0.2.0", path = "i18n" }
rlvgl-app-demo = { version = "0.2.0", path = "examples/apps/demo", default-features = false, optional = true }
rlvgl-app-disco-demo = { version = "0.2.0", path = "examples/apps/disco-demo", default-features = false, optional = true }

[dependencies.gif]
version = "0.13.3"
optional = true
[dependencies.fontdue]
version = "0.9.3"
optional = true
[dependencies.embedded-canvas]
version = "0.3.1"
optional = true
[dependencies.embedded-graphics]
version = "0.8"
optional = true
[dependencies.fatfs]
version = "0.3"
optional = true
[dependencies.fscommon]
version = "0.1"
optional = true
[dependencies.yane]
version = "1"
default-features = false
optional = true

[dependencies.rlvgl-playit]
version = "0.2.0"
path = "playit"
default-features = false
optional = true

[dependencies.rlvgl-decomp]
version = "0.2.0"
path = "rlvgl-decomp"
optional = true

[dependencies.zstd]
version = "0.13.3"
optional = true
[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
optional = true

[dependencies.apng]
version = "0.3"
features = ["png"]
optional = true

[dependencies.png]
version = "0.18.0"
optional = true

[dependencies.clap]
version = "4.5.4"
features = ["derive"]
optional = true

[dependencies.anyhow]
version = "1"
optional = true

[dependencies.walkdir]
version = "2"
optional = true

[dependencies.blake3]
version = "1"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_yaml]
version = "0.9"
optional = true


[dependencies.schemars]
version = "1.2.0"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.regex]
version = "1"
optional = true

[dependencies.indexmap]
version = "2"
optional = true
features = ["serde"]

[dependencies.minijinja]
version = "2"
optional = true

[dependencies.spdx]
version = "0.13.3"
optional = true

[dependencies.rayon]
version = "1"
optional = true

[dependencies.resvg]
version = "0.45.1"
optional = true

[dependencies.eframe]
version = "0.33.3"
optional = true

[dependencies.open]
version = "5"
optional = true

[dependencies.notify]
version = "8.2.0"
optional = true

[dependencies.rfd]
version = "0.16.0"
optional = true

[dependencies.rlvgl-bsps-stm]
version = "0.2.0"
path = "chips/stm/bsps"
optional = true
[dependencies.rlvgl-chips-stm]
version = "0.2.0"
path = "chipdb/rlvgl-chips-stm"
optional = true

[dependencies.rlvgl-chips-nrf]
version = "0.2.0"
path = "chipdb/rlvgl-chips-nrf"
optional = true

[dependencies.rlvgl-chips-esp]
version = "0.2.0"
path = "chipdb/rlvgl-chips-esp"
optional = true

[dependencies.rlvgl-chips-nxp]
version = "0.2.0"
path = "chipdb/rlvgl-chips-nxp"
optional = true

[dependencies.rlvgl-chips-silabs]
version = "0.2.0"
path = "chipdb/rlvgl-chips-silabs"
optional = true

[dependencies.rlvgl-chips-microchip]
version = "0.2.0"
path = "chipdb/rlvgl-chips-microchip"
optional = true

[dependencies.rlvgl-chips-renesas]
version = "0.2.0"
path = "chipdb/rlvgl-chips-renesas"
optional = true

[dependencies.rlvgl-chips-ti]
version = "0.2.0"
path = "chipdb/rlvgl-chips-ti"
optional = true

[dependencies.rlvgl-chips-rp2040]
version = "0.2.0"
path = "chipdb/rlvgl-chips-rp2040"
optional = true

[dependencies.tar]
version = "0.4"
optional = true

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
rlvgl-chips-stm = { version = "0.2.0", path = "chipdb/rlvgl-chips-stm" }
rlvgl-chips-nrf = { version = "0.2.0", path = "chipdb/rlvgl-chips-nrf" }
rlvgl-chips-esp = { version = "0.2.0", path = "chipdb/rlvgl-chips-esp" }
rlvgl-chips-nxp = { version = "0.2.0", path = "chipdb/rlvgl-chips-nxp" }
rlvgl-chips-silabs = { version = "0.2.0", path = "chipdb/rlvgl-chips-silabs" }
rlvgl-chips-microchip = { version = "0.2.0", path = "chipdb/rlvgl-chips-microchip" }
rlvgl-chips-renesas = { version = "0.2.0", path = "chipdb/rlvgl-chips-renesas" }
rlvgl-chips-ti = { version = "0.2.0", path = "chipdb/rlvgl-chips-ti" }
rlvgl-chips-rp2040 = { version = "0.2.0", path = "chipdb/rlvgl-chips-rp2040" }
serde_json = "1"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
zstd = "0.13.3"
syn = { version = "2", features = ["full"] }

[features]
default = []
regression = []
playit = ["dep:rlvgl-playit"]
png = ["rlvgl-core/png", "rlvgl-platform/png", "rlvgl-app-demo?/png"]
jpeg = ["rlvgl-core/jpeg", "rlvgl-platform/jpeg", "rlvgl-app-demo?/jpeg"]
gif = ["rlvgl-core/gif", "dep:gif", "rlvgl-platform/gif", "rlvgl-app-demo?/gif"]
qrcode = ["rlvgl-core/qrcode", "rlvgl-platform/qrcode", "rlvgl-app-demo?/qrcode"]
simulator = ["rlvgl-platform/simulator", "dep:rlvgl-app-demo", "dep:rlvgl-app-disco-demo"]
fontdue = ["rlvgl-core/fontdue", "rlvgl-platform/fontdue", "dep:fontdue", "rlvgl-app-demo?/fontdue"]
lottie = ["rlvgl-core/lottie", "rlvgl-platform/lottie"]
lottie_runtime = ["lottie", "rlvgl-core/lottie_backend"]
canvas = ["rlvgl-core/canvas", "rlvgl-platform/canvas", "dep:embedded-canvas", "dep:embedded-graphics"]
pinyin = ["rlvgl-core/pinyin", "rlvgl-platform/pinyin"]
fatfs = ["rlvgl-core/fatfs", "rlvgl-platform/fatfs", "dep:fatfs", "dep:fscommon"]
nes = ["rlvgl-core/nes", "rlvgl-platform/nes", "dep:yane"]
apng = ["rlvgl-core/apng", "dep:image", "rlvgl-platform/apng"]
fs = ["rlvgl-core/fs"]
creator = [
    "dep:clap",
    "dep:anyhow",
    "dep:walkdir",
    "dep:blake3",
    "dep:serde",
    "dep:serde_yaml",
    "dep:image",
    "dep:minijinja",
    "dep:apng",
    "dep:png",
    "dep:schemars",
    "dep:serde_json",
    "dep:regex",
    "dep:indexmap",
    "dep:spdx",
    "dep:fontdue",
    "dep:rayon",
    "dep:resvg",
    "dep:zstd",
    "dep:tar",
    "dep:rlvgl-bsps-stm",
    "dep:rlvgl-chips-stm",
    "dep:rlvgl-chips-nrf",
    "dep:rlvgl-chips-esp",
    "dep:rlvgl-chips-nxp",
    "dep:rlvgl-chips-silabs",
    "dep:rlvgl-chips-microchip",
    "dep:rlvgl-chips-renesas",
    "dep:rlvgl-chips-ti",
    "dep:rlvgl-chips-rp2040",
    "dep:rlvgl-decomp",
]
creator_ui = [
    "dep:eframe",
    "dep:anyhow",
    "dep:serde",
    "dep:serde_yaml",
    "dep:image",
    "dep:schemars",
    "dep:walkdir",
    "dep:blake3",
    "dep:apng",
    "dep:png",
    "dep:open",
    "dep:notify",
    "dep:rfd",
    "dep:serde_json",
    "dep:zstd",
    "dep:tar",
    "dep:rlvgl-bsps-stm",
    "dep:rlvgl-chips-stm",
    "dep:rlvgl-chips-nrf",
    "dep:rlvgl-chips-esp",
    "dep:rlvgl-chips-nxp",
    "dep:rlvgl-chips-silabs",
    "dep:rlvgl-chips-microchip",
    "dep:rlvgl-chips-renesas",
    "dep:rlvgl-chips-ti",
    "dep:rlvgl-chips-rp2040",
    "simulator",
    "png",
    "jpeg",
    "gif",
    "qrcode",
    "fontdue",
]
 


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 2
debug = true
incremental = false

[workspace.dependencies]
image = "0.25.6"
## Removed unavailable objc2* workspace deps to fix crates.io resolution

# macOS-specific Objective‑C crates required by simulator/windowing on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = "0.3.1"
objc2-app-kit = "0.3.1"

[workspace]
members = [
    "core", "platform", "widgets", "ui", "api", "micropython", "fs-sim", "i18n", "playit",
    "examples/apps/demo", "examples/apps/disco-demo",
    "examples/sim", "examples/disco-sim", "examples/stm32h747i-disco",
    "examples/beetle-esp32c3",
    "examples/beetle-esp32p4",
    "examples/stm32h747i-disco/assets/disco-assets",
    "chipdb/rlvgl-chips-stm", "chipdb/rlvgl-chips-nrf", "chipdb/rlvgl-chips-esp",
    "chipdb/rlvgl-chips-nxp", "chipdb/rlvgl-chips-silabs", "chipdb/rlvgl-chips-microchip",
    "chipdb/rlvgl-chips-renesas", "chipdb/rlvgl-chips-ti", "chipdb/rlvgl-chips-rp2040",
    "chips/stm/bsps", "rlvgl-decomp",
]
# UEFI example is excluded from workspace — it conflicts with std on host targets.
# Build it explicitly: cargo build -p rlvgl-example-uefi-disco --target aarch64-unknown-uefi
exclude = ["examples/uefi-disco", "examples/beetle-avr"]
