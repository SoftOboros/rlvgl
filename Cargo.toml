rlvgl-i18n = { version = "0.2.2", path = "i18n" }
rlvgl-app-demo = { version = "0.2.4", path = "examples/apps/demo", default-features = false, optional = true }
rlvgl-app-disco-demo = { version = "0.2.4", path = "examples/apps/disco-demo", default-features = false, optional = true }

