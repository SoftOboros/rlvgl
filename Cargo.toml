optional = true

[dependencies.rlvgl-bsps-stm]
version = "0.2.0"
path = "chips/stm/bsps"
optional = true
[dependencies.rlvgl-chips-stm]
version = "0.2.0"
path = "chipdb/rlvgl-chips-stm"
optional = true

[dependencies.rlvgl-chips-nrf]
version = "0.2.0"
path = "chipdb/rlvgl-chips-nrf"
optional = true

[dependencies.rlvgl-chips-esp]
version = "0.2.0"
