version = "0.4"
optional = true

# CRATES-CI-04: Layer W automation server (CRATES-CI-00 §7.2). The kittest
# engine moves into [dependencies] (optional) so the shipped rlvgl-creator
# binary can host CreatorApp headlessly behind `creator_ui_automation`.
# The [dev-dependencies] entry below stays — tests/creator_ui_kittest.rs
# (Layer K) is unaffected.
[dependencies.egui_kittest]
version = "0.33.3"
features = ["eframe", "snapshot", "wgpu"]
optional = true

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
# CRATES-CI-03: Layer K kittest engine (egui 0.33 line, lockstep with the
# eframe 0.33.3 GUI wrapper dep). `eframe` provides Harness::new_eframe for
# eframe::App impls; `wgpu` is the offscreen renderer (works headless,
# INV-C5); `snapshot` enables threshold-compared image snapshots (INV-C4).
egui_kittest = { version = "0.33.3", features = ["eframe", "snapshot", "wgpu"] }
rlvgl-chips-stm = { version = "0.2.0", path = "chipdb/rlvgl-chips-stm" }
rlvgl-chips-nrf = { version = "0.2.0", path = "chipdb/rlvgl-chips-nrf" }
rlvgl-chips-esp = { version = "0.2.0", path = "chipdb/rlvgl-chips-esp" }
rlvgl-chips-nxp = { version = "0.2.0", path = "chipdb/rlvgl-chips-nxp" }
rlvgl-chips-silabs = { version = "0.2.0", path = "chipdb/rlvgl-chips-silabs" }
rlvgl-chips-microchip = { version = "0.2.2", path = "chipdb/rlvgl-chips-microchip" }
rlvgl-chips-renesas = { version = "0.2.0", path = "chipdb/rlvgl-chips-renesas" }
rlvgl-chips-ti = { version = "0.2.0", path = "chipdb/rlvgl-chips-ti" }
rlvgl-chips-rp2040 = { version = "0.2.0", path = "chipdb/rlvgl-chips-rp2040" }
serde_json = "1"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
zstd = "0.13.3"
syn = { version = "2", features = ["full"] }
# APP-05 parity tests: parse emitted + reference Cargo.toml as real TOML
# so multi-line `[features]` lists round-trip cleanly.
toml = "0.8"
# QT-05b test fixture: hand-vendored mock istate-codegen output that
# satisfies the QT-05 §6 6-symbol linkage surface. Used only by
# `tests/creator_qt_emit_stopwatch_compile.rs` to compile-check the
# emitted dispatch glue without the live softoboros MCP.
stopwatch_gen = { path = "tests/fixtures/qt/stopwatch_gen" }

[features]
default = []
regression = []
## Opt-in: run the ESP32-C3 BSP generator and `cargo check` its output against
## the real `esp32c3` PAC crate on `riscv32imc-unknown-none-elf`. Heavy — needs
## the riscv32imc target + network access to fetch `esp32c3` from crates.io.
compile-verify = ["creator", "regression"]
playit = ["dep:rlvgl-playit"]
png = ["rlvgl-core/png", "rlvgl-platform/png", "rlvgl-app-demo?/png"]
jpeg = ["rlvgl-core/jpeg", "rlvgl-platform/jpeg", "rlvgl-app-demo?/jpeg"]
gif = ["rlvgl-core/gif", "dep:gif", "rlvgl-platform/gif", "rlvgl-app-demo?/gif"]
qrcode = ["rlvgl-core/qrcode", "rlvgl-platform/qrcode", "rlvgl-app-demo?/qrcode"]
simulator = ["rlvgl-platform/simulator", "dep:rlvgl-app-demo", "dep:rlvgl-app-disco-demo"]
fontdue = ["rlvgl-core/fontdue", "rlvgl-platform/fontdue", "dep:fontdue", "rlvgl-app-demo?/fontdue"]
lottie = ["rlvgl-core/lottie", "rlvgl-platform/lottie"]
lottie_runtime = ["lottie", "rlvgl-core/lottie_backend"]
canvas = ["rlvgl-core/canvas", "rlvgl-platform/canvas", "dep:embedded-canvas", "dep:embedded-graphics"]
pinyin = ["rlvgl-core/pinyin", "rlvgl-platform/pinyin"]
fatfs = ["rlvgl-core/fatfs", "rlvgl-platform/fatfs", "dep:fatfs", "dep:fscommon"]
nes = ["rlvgl-core/nes", "rlvgl-platform/nes", "dep:yane"]
apng = ["rlvgl-core/apng", "dep:image", "rlvgl-platform/apng"]
fs = ["rlvgl-core/fs"]
creator = [
    "dep:clap",
    "dep:anyhow",
    "dep:walkdir",
    "dep:blake3",
    "dep:serde",
    "dep:serde_yaml",
    "dep:image",
    "dep:minijinja",
    "dep:apng",
    "dep:png",
    "dep:schemars",
    "dep:serde_json",
    "dep:regex",
    "dep:indexmap",
    "dep:spdx",
    "dep:fontdue",
    "dep:rayon",
    "dep:resvg",
    "dep:zstd",
    "dep:tar",
    "dep:rlvgl-bsps-stm",
    "dep:rlvgl-chips-stm",
    "dep:rlvgl-chips-nrf",
    "dep:rlvgl-chips-esp",
    "dep:rlvgl-chips-nxp",
    "dep:rlvgl-chips-silabs",
    "dep:rlvgl-chips-microchip",
    "dep:rlvgl-chips-renesas",
    "dep:rlvgl-chips-ti",
    "dep:rlvgl-chips-rp2040",
    "dep:rlvgl-decomp",
]
creator_ui = [
    "dep:eframe",
    "dep:anyhow",
    "dep:serde",
    "dep:serde_yaml",
    "dep:image",
    "dep:schemars",
    "dep:walkdir",
    "dep:blake3",
    "dep:apng",
    "dep:png",
    "dep:open",
    "dep:notify",
    "dep:rfd",
    "dep:serde_json",
    "dep:zstd",
    "dep:tar",
    "dep:rlvgl-bsps-stm",
    "dep:rlvgl-chips-stm",
    "dep:rlvgl-chips-nrf",
    "dep:rlvgl-chips-esp",
    "dep:rlvgl-chips-nxp",
    "dep:rlvgl-chips-silabs",
    "dep:rlvgl-chips-microchip",
    "dep:rlvgl-chips-renesas",
    "dep:rlvgl-chips-ti",
    "dep:rlvgl-chips-rp2040",
    "simulator",
    "png",
    "jpeg",
    "gif",
    "qrcode",
    "fontdue",
]
# CRATES-CI-04: Layer W — `rlvgl-creator --automation-headless
# --playit-port=<n>` serves the frozen playit verb set (INV-C3) over TCP,
# executing each verb against an egui_kittest harness hosting CreatorApp.
# No window / display server (INV-C5). Reuses the rlvgl-playit protocol
# codec (`std` for the loopback TCP types' io plumbing).
creator_ui_automation = [
    "creator_ui",
    "dep:egui_kittest",
    "dep:rlvgl-playit",
    "rlvgl-playit/std",
]
 


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 2
debug = true
incremental = false

[workspace.dependencies]
image = "0.25.6"
## Removed unavailable objc2* workspace deps to fix crates.io resolution

# macOS-specific Objective‑C crates required by simulator/windowing on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = "0.3.1"
objc2-app-kit = "0.3.1"

[workspace]
members = [
    "core", "platform", "widgets", "ui", "api", "micropython", "fs-sim", "i18n", "playit",
    "examples/apps/demo", "examples/apps/disco-demo",
    "examples/sim", "examples/disco-sim", "examples/stm32h747i-disco",
    "examples/beetle-esp32c3",
    "examples/beetle-esp32p4",
    "examples/beaglebone-black",
    "examples/stm32h747i-disco/assets/disco-assets",
    "chipdb/rlvgl-chips-stm", "chipdb/rlvgl-chips-nrf", "chipdb/rlvgl-chips-esp",
    "chipdb/rlvgl-chips-nxp", "chipdb/rlvgl-chips-silabs", "chipdb/rlvgl-chips-microchip",
    "chipdb/rlvgl-chips-renesas", "chipdb/rlvgl-chips-ti", "chipdb/rlvgl-chips-rp2040",
    "chips/stm/bsps", "rlvgl-decomp",
    "audio-meters-core",
]
# UEFI example is excluded from workspace — it conflicts with std on host targets.
# Build it explicitly: cargo build -p rlvgl-example-uefi-disco --target aarch64-unknown-uefi
# vendor/scjson is a reference-only submodule (BSD-1-Clause); never linked into our build.
# disco-demo-states is the APP-04b vendored SM crate (mcp-statechart output);
# excluded so its non-idiomatic codegen variant naming doesn't fail workspace clippy.
# It is built/tested separately by tests/creator_app_round_trip_disco_sm.rs.
exclude = [
    "examples/uefi-disco",
    "examples/beetle-avr",
    "vendor/scjson",
    "examples/stm32h747i-disco/disco-demo-states",
    # CRATES-CI-01: extracted staged packages under target/crates-ci/staged/
    # are built in place by consumers/creator-cli/smoke.sh; a packaged
    # manifest has no [workspace] table and would otherwise be claimed by
    # this one ("current package believes it's in a workspace when it's not").
    "target",
]
